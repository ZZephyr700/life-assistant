<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作生活助手</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#08090c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生活助手">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ================================================================
   我的生活助手 —— 视觉系统 v3「深空 / Deep Space」
   ----------------------------------------------------------------
   设计取向：深色科技 + 动效优先（portfolio 级）
   1. 四档色调表达层级（base → surface → raised → sunken），不用描边造卡
   2. 唯一强调色 indigo；cyan 仅作大气层，永不承载文字
   3. 字号阶梯收敛为 5 档（display / title / body / small / micro）
   4. 动效全部走 transform + opacity，且以 data-reveal 渐进增强：
      无 JS 或 prefers-reduced-motion 时内容完整可见，绝不隐藏
   5. 圆角全站统一 12px（一处决定，处处一致）
   ================================================================ */
:root{
  color-scheme:dark;

  /* ---- 四档色调：唯一的层级手段 ---- */
  --base:#08090c;      /* 页面底 */
  --surface:#13161e;   /* 抬升面：卡片、侧栏（与 base 拉开可辨的色调差） */
  --raised:#1b1f29;    /* 再抬升：hover、浮层 */
  --sunken:#0b0d12;    /* 凹陷：输入框、井、轨道 */
  --edge:rgba(255,255,255,.07);

  /* ---- 墨色阶梯（对比度经 WCAG 计算验证） ---- */
  --ink:#f2f4f8;       /* 正文 16.4:1 on base */
  --ink-strong:#ffffff;/* 展示数字、主标题 */
  --ink-mute:#a3abb9;  /* 次信息 >= 8:1 */
  --ink-faint:#7b8494; /* 三级标注（仅小字，>=4.6:1） */
  --rule:rgba(255,255,255,.10);

  /* ---- 唯一强调色（electric indigo） ---- */
  --accent:#7c95ff;
  --accent-deep:#9aadff;
  --accent-wash:rgba(124,149,255,.13);
  --accent-ink:#aebeff;
  --on-accent:#07080b;

  /* ---- 仅语义状态 ---- */
  --good:#43d69b;   --good-wash:rgba(67,214,155,.13);
  --action:#ff7a7a; --action-wash:rgba(255,122,122,.13);
  --note:#f0b45e;   --note-wash:rgba(240,180,94,.13);

  /* ---- 大气层：永不承载文字 ---- */
  --atmos-cyan:#22d3ee;
  --atmos-violet:#8b5cf6;

  /* ---- 唯一圆角 + 缓动 ---- */
  --r:12px;
  --r-sm:8px;
  --t:cubic-bezier(.2,.8,.2,1);
  --t-out:cubic-bezier(.16,1,.3,1);

  --toast-bg:#171a22; --toast-fg:#f2f4f8;

  /* ---- 兼容别名（JS 内联样式仍在引用这些旧名，必须保留） ---- */
  --paper:var(--base);   --bg:var(--base);
  --text:var(--ink);     --muted:var(--ink-mute);
  --primary:var(--accent); --primary-text:var(--accent-ink); --primary-soft:var(--accent-wash);
  --ok:var(--good); --danger:var(--action); --warn:var(--note);
  --ink-soft:var(--ink-mute);
  --ink-line:var(--rule); --hairline:var(--rule); --hairline-soft:var(--rule);
  --well:var(--sunken);
}
/* 明暗两态统一为深色：应用深色优先，选择器保留是为了兼容 JS 的 data-theme 写入 */
html[data-theme="light"],html[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
/* 关键：横向裁切不能用 hidden。body{overflow-x:hidden} 会把 body 变成滚动容器，
   抢走 html 的滚动权，导致 window.scrollTo 只移动十几像素，粘性顶栏下移压住标题。
   用 clip 只裁切、不建立滚动容器（老浏览器回退到 hidden，此时靠 overflow-y:visible 兜底）。 */
html{height:100%;background:var(--base);overflow-x:clip}
body{
  min-height:100svh;
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",
              "PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:var(--base);
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
  overflow-x:clip;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
::selection{background:color-mix(in srgb,var(--accent) 34%,transparent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
.app{display:flex;min-height:100svh;position:relative;z-index:1}

/* ================================================================
   大气层：极光 + 点阵网格（纯装饰，不参与交互）
   ================================================================ */
.atmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;isolation:isolate}
/* 极光：两团缓慢游动的径向光，取自 Aceternity aurora-background 的位移思路 */
.atmos::before,.atmos::after{
  content:"";position:absolute;border-radius:50%;
  filter:blur(70px);opacity:.9;will-change:transform;
}
.atmos::before{
  width:58vw;height:58vw;left:-16vw;top:-20vw;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 62%,transparent),transparent 68%);
  animation:atmos-drift-a 34s ease-in-out infinite;
}
.atmos::after{
  width:50vw;height:50vw;right:-14vw;top:-2vw;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--atmos-cyan) 44%,transparent),transparent 68%);
  animation:atmos-drift-b 44s ease-in-out infinite;
}
@keyframes atmos-drift-a{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(6vw,4vw,0) scale(1.14)}
}
@keyframes atmos-drift-b{
  0%,100%{transform:translate3d(0,0,0) scale(1.08)}
  50%{transform:translate3d(-5vw,6vw,0) scale(.92)}
}
/* 点阵网格：Aceternity bg-grid 的同款手法，用 CSS 渐变而非图片 */
.grid-veil{
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(120% 90% at 50% 0%,#000 12%,transparent 76%);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 12%,transparent 76%);
}
/* 顶部活动光带：缓慢横移，让首屏有生命感 */
.grid-veil::after{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 60%,transparent),transparent);
  animation:veil-sweep 9s ease-in-out infinite;
}
@keyframes veil-sweep{
  0%,100%{transform:translateX(-16%);opacity:.5}
  50%{transform:translateX(16%);opacity:1}
}

/* ================================================================
   鼠标：跟手光斑 + 滚动进度
   ================================================================ */
#cursorGlow{
  position:fixed;left:0;top:0;width:560px;height:560px;z-index:2;
  margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 20%,transparent),transparent 70%);
  opacity:0;transition:opacity .5s var(--t);will-change:transform;
}
#cursorGlow.on{opacity:1}
#scrollBar{
  position:fixed;left:0;top:0;height:2px;width:100%;z-index:60;
  transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--accent),var(--atmos-cyan));
  pointer-events:none;
}

/* ========== 侧边导航（与纸面对比的素面栏） ========== */
.side{
  width:238px;flex-shrink:0;height:100svh;position:sticky;top:0;
  display:flex;flex-direction:column;
  padding:34px 18px 24px;background:var(--surface);
  box-shadow:1px 0 0 0 rgba(255,255,255,.045);
}
.logo{
  font-size:15.5px;font-weight:650;letter-spacing:-.01em;
  padding:0 12px 28px;display:flex;align-items:center;gap:11px;
}
.logo .dot{
  width:10px;height:10px;border-radius:3px;flex-shrink:0;
  background:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent),
             0 0 18px color-mix(in srgb,var(--accent) 62%,transparent);
  animation:dot-pulse 3.4s var(--t) infinite;
}
@keyframes dot-pulse{
  0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent),0 0 18px color-mix(in srgb,var(--accent) 62%,transparent)}
  50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 9%,transparent),0 0 26px color-mix(in srgb,var(--accent) 82%,transparent)}
}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding:0}
.nav button{
  position:relative;display:block;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-sm);
  color:var(--ink-mute);font-weight:550;font-size:14.5px;
  transition:color .2s var(--t),background .2s var(--t),transform .2s var(--t);
}
.nav button::before{
  content:"";position:absolute;left:2px;top:50%;width:3px;height:0;
  border-radius:99px;background:var(--accent);
  transform:translateY(-50%);transition:height .26s var(--t-out);
}
.nav button:hover{color:var(--ink);background:var(--raised);transform:translateX(2px)}
.nav button.on{color:var(--accent-ink);font-weight:650;background:var(--accent-wash)}
.nav button.on::before{height:16px}
.side-foot{
  margin-top:auto;padding:20px 12px 0;
  font-size:12.5px;line-height:1.7;color:var(--ink-faint);
}

/* ========== 主区域 ========== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;
  padding:30px 52px 16px;display:flex;align-items:baseline;gap:14px;
  background:color-mix(in srgb,var(--base) 86%,transparent);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 1px 0 0 rgba(255,255,255,.045);
}
.topbar h1{font-size:14px;font-weight:600;color:var(--ink-mute);letter-spacing:0}
.topbar .sub{color:var(--ink-faint);font-size:12.5px}
.content{padding:14px 52px 140px;max-width:1100px;width:100%}

/* ========== 通用组件 ========== */
.card{
  background:var(--surface);border-radius:var(--r);
  padding:26px 28px;margin-bottom:18px;
}
.card h3{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.card h3 .cnt{color:var(--ink-soft);font-weight:400;font-size:13px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink-soft)}
.small{font-size:13px}

.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 18px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--on-accent);
  font-weight:650;font-size:14px;
  transition:background .22s var(--t),box-shadow .28s var(--t),transform .22s var(--t-out);
  will-change:transform;
}
.btn:hover{
  background:var(--accent-deep);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent),
             0 8px 26px -6px color-mix(in srgb,var(--accent) 55%,transparent);
}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--raised);color:var(--ink)}
.btn.ghost:hover{
  background:color-mix(in srgb,var(--ink) 9%,var(--raised));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 12%,transparent);
}
.btn.danger{background:transparent;color:var(--action);padding:8px 10px}
.btn.danger:hover{background:var(--action-wash)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.lg{padding:14px 24px;font-size:15px}
.btn.icon{padding:7px 13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border-radius:var(--r);outline:none;
  background:var(--sunken);border:1px solid transparent;color:var(--ink);
  transition:border-color .18s var(--t),background .18s var(--t);
}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--accent);background:var(--surface)}
textarea.input{resize:vertical;min-height:110px;line-height:1.8}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:16px 0 7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r);font-size:12.5px;font-weight:600;background:var(--accent-wash);color:var(--accent-ink)}
.chip.gray{background:var(--sunken);color:var(--ink-soft)}
.chip.warn{background:var(--note-wash);color:var(--note)}
.chip.ok{background:var(--good-wash);color:var(--good)}
.chip.danger{background:var(--action-wash);color:var(--action)}
.pg{position:relative;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.pg>i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--atmos-cyan) 70%,var(--accent)));
  transition:width .5s var(--t-out);
  position:relative;overflow:hidden;
}
.pg>i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  background-size:200% 100%;
  animation:shimmer 2.4s linear infinite;
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{text-align:center;padding:34px 10px;color:var(--ink-soft);font-size:14px}
.empty .ei{display:none}
.divider{margin:22px 0}
.hr-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.hr-row h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
.stat{text-align:left}
.stat .n{font-size:34px;font-weight:680;letter-spacing:-.03em;line-height:1.12;font-variant-numeric:tabular-nums;color:var(--ink-strong)}
.stat .l{font-size:13px;color:var(--ink-soft);margin-top:4px}

/* 列表条目：只用留白分隔，不画线 */
.item{
  display:flex;align-items:flex-start;gap:12px;padding:14px 12px;border-radius:var(--r-sm);
  transition:background .2s var(--t);
}
.item:hover{background:var(--raised)}
.item .ck{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item.done .tx{text-decoration:line-through;color:var(--ink-soft)}
.item .meta{margin-top:5px;font-size:13px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ========== 首页：今日总览 ========== */
.cc-hero{margin-bottom:36px}
.cc-hd{margin-bottom:34px}
.cc-hd h2{
  font-size:clamp(38px,6.4vw,92px);
  font-weight:700;letter-spacing:-.044em;line-height:1;
  color:var(--ink-strong);
  background:linear-gradient(178deg,#ffffff 34%,#b9c2d6 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.cc-day{margin-top:14px;font-size:14px;color:var(--ink-soft)}
.cc-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.cc-card{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;
  padding:24px 22px;border-radius:var(--r);
  background:var(--surface);color:var(--ink);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));
  transition:background .28s var(--t),transform .34s var(--t-out);
  will-change:transform;
  overflow:hidden;
}
.cc-card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),
             color-mix(in srgb,var(--accent) 17%,transparent),transparent 62%);
  opacity:0;transition:opacity .34s var(--t);
}
.cc-card:hover::before{opacity:1}
.cc-card:hover{background:var(--raised)}
.cc-card:active{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(.99)}
.cc-card:nth-child(1){grid-column:span 7}
.cc-card:nth-child(2){grid-column:span 5}
.cc-card:nth-child(3){grid-column:span 5}
.cc-card:nth-child(4){grid-column:span 7}
.cc-card .cc-name{font-size:14px;font-weight:600;color:var(--ink-soft)}
.cc-card .cc-status{
  font-size:clamp(30px,3.4vw,42px);font-weight:700;
  letter-spacing:-.04em;line-height:1.08;
  font-variant-numeric:tabular-nums;color:var(--ink-strong);
}
.cc-card .cc-status.txt{font-size:clamp(20px,2.2vw,26px);letter-spacing:-.01em}
.cc-card .cc-note{font-size:14px;color:var(--ink-soft)}
.cc-card .cc-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.cc-card .pg{width:100%;margin-top:6px}
.cc-acts{margin-bottom:34px;display:flex;gap:10px;flex-wrap:wrap}

/* 入场编排：标题聚焦 + 卡片按序浮现（只动 transform / opacity） */
@media(prefers-reduced-motion:no-preference){
  /* 用 backwards 而非 both：动画结束后不保留 transform，避免给标题留下持久变换层 */
  .cc-hd h2{animation:title-in .9s var(--t-out) backwards}
  @keyframes title-in{
    from{opacity:0;letter-spacing:-.095em;transform:translateY(12px)}
  }
  .cc-card{animation:card-in .68s var(--t-out) both}
  .cc-card:nth-child(1){animation-delay:.05s}
  .cc-card:nth-child(2){animation-delay:.13s}
  .cc-card:nth-child(3){animation-delay:.21s}
  .cc-card:nth-child(4){animation-delay:.29s}
  @keyframes card-in{
    from{opacity:0;transform:translateY(20px) scale(.985)}
    to{opacity:1;transform:none}
  }
}

/* ========== 看板 ========== */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.board{grid-template-columns:1fr 1fr}}
.col{background:var(--sunken);border-radius:var(--r);padding:14px;min-height:120px}
.col h4{font-size:12.5px;margin-bottom:12px;display:flex;justify-content:space-between;color:var(--ink-soft);font-weight:650}
.pcard{
  background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:9px;
  transition:background .2s var(--t),transform .2s var(--t-out);
}
.pcard:hover{background:var(--raised);transform:translateY(-2px)}
.pcard .tt{font-weight:600;font-size:14px;word-break:break-all}
.pcard .meta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pcard .acts{margin-top:9px;display:flex;gap:6px}

/* ========== 习惯格 ========== */
.dots{display:inline-flex;gap:5px;margin:0 6px}
.dot{
  width:22px;height:22px;border-radius:var(--r-sm);background:var(--sunken);
  color:var(--ink-faint);font-size:11px;display:flex;align-items:center;justify-content:center;
  transition:background .2s var(--t),color .2s var(--t),transform .2s var(--t-out);
}
.dot.on{background:var(--accent);color:var(--on-accent);font-weight:650;box-shadow:0 0 14px -2px color-mix(in srgb,var(--accent) 70%,transparent)}
.habit-name{flex:1;font-weight:600}

/* ========== 计时器 ========== */
.timer-wrap{text-align:center;padding:16px 0 6px}
.timer{font-size:58px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer-btns{margin-top:18px;display:flex;gap:10px;justify-content:center}

/* ========== 图表 / 表格 / 分段控件 ========== */
.chart{width:100%;height:auto;display:block}
.ax{fill:var(--ink-soft);font-size:11px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left}
table.tb th{color:var(--ink-soft);font-weight:600;font-size:13px}
.tabs{
  display:flex;gap:3px;padding:4px;border-radius:var(--r-sm);margin-bottom:20px;
  width:fit-content;background:var(--sunken);box-shadow:0 0 0 1px rgba(255,255,255,.05);
}
.tabs button{
  padding:7px 17px;border-radius:6px;font-size:13.5px;color:var(--ink-mute);font-weight:600;
  transition:background .24s var(--t),color .24s var(--t);
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{
  background:var(--raised);color:var(--ink);font-weight:650;
  box-shadow:0 2px 10px -4px rgba(0,0,0,.7);
}
.date-nav{display:flex;align-items:center;gap:10px}
.date-nav .d{min-width:180px;text-align:center;font-weight:650}
.cup{
  display:inline-block;width:24px;height:24px;border-radius:var(--r-sm);
  background:var(--sunken);cursor:pointer;
  transition:background .2s var(--t),transform .2s var(--t-out),box-shadow .2s var(--t);
}
.cup:hover{transform:translateY(-2px);box-shadow:0 6px 16px -6px rgba(0,0,0,.7)}
.cup:active{transform:translateY(0)}
.cup.on{background:var(--accent);box-shadow:0 0 14px -3px color-mix(in srgb,var(--accent) 75%,transparent)}
.cup.off{background:var(--sunken)}
.stars{color:var(--note);letter-spacing:2px}

/* ========== 日记月历 ========== */
.dcalbox{background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 18px}
.dcalnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:14px}
.dcalnav .btn{width:36px}
.dcalgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dcalhd{text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);padding:4px 0}
.dcal{
  position:relative;aspect-ratio:1/1;border-radius:var(--r-sm);
  background:transparent;color:var(--ink);font-size:13.5px;cursor:pointer;padding:0;
  transition:background .2s var(--t),color .2s var(--t),transform .2s var(--t-out);
}
.dcal:hover{background:var(--raised);transform:scale(1.06)}
.dcal:active{transform:scale(.96)}
.dcal.out{color:var(--ink-soft);opacity:.5}
.dcal i{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--good)}
.dcal.has{background:var(--good-wash);font-weight:650}
.dcal.td{background:var(--accent-wash);color:var(--accent-ink);font-weight:650}
.dcal.sel{background:var(--accent);color:var(--on-accent);font-weight:650;box-shadow:0 0 18px -4px color-mix(in srgb,var(--accent) 80%,transparent)}
.dcal.sel i{background:var(--on-accent)}

/* ========== 习惯热力图 ========== */
.heatgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hhead{font-style:normal;text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);padding:2px 0}
.hcell{
  display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;
  border-radius:var(--r-sm);font-size:12px;font-style:normal;
  background:var(--sunken);color:var(--ink-faint);
  transition:transform .2s var(--t-out);
}
.hcell:hover{transform:scale(1.1)}
.hcell.blank{background:transparent}
.hcell.l1{background:color-mix(in srgb,var(--good) 22%,var(--sunken));color:var(--ink)}
.hcell.l2{background:color-mix(in srgb,var(--good) 46%,var(--sunken));color:var(--on-accent)}
.hcell.l3{background:color-mix(in srgb,var(--good) 72%,var(--sunken));color:var(--on-accent)}
.hcell.l4{background:var(--good);color:var(--on-accent);box-shadow:0 0 16px -4px color-mix(in srgb,var(--good) 80%,transparent)}
.hcell.sm{width:18px;height:18px;aspect-ratio:auto}
.heatlegend{display:flex;align-items:center;gap:5px;margin-top:12px}

/* ========== 周报告柱状图 ========== */
.bw{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:160px;padding:12px 4px 0;border-bottom:1px solid var(--rule)}/* taste-skill-ignore: 柱状图基线，属于数据图形 */
.bwcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bwnum{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;min-height:16px}
.bwbar{
  width:72%;min-height:0;border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 52%,var(--base)));
  transition:height .5s var(--t-out);
}
.bwbar.today{background:linear-gradient(180deg,var(--note),color-mix(in srgb,var(--note) 52%,var(--base)))}
.bwlbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

/* ========== 日记配图 ========== */
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.ph{position:relative;width:108px;height:108px;border-radius:var(--r-sm);overflow:hidden;background:var(--sunken)}
.phimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--sunken)}
.phimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--t-out)}
.ph:hover .phimg img{transform:scale(1.07)}
.phdel{
  position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:var(--r);
  background:rgba(8,9,12,.82);color:#fff;font-size:14px;line-height:1;z-index:1;cursor:pointer;
  transition:opacity .18s var(--t);
}
.phdel:hover{opacity:.78}

/* ========== 提示条：用实心色块表达状态 ========== */
.warnbox{
  background:var(--note-wash);color:var(--note);
  padding:14px 18px;border-radius:var(--r);font-size:13.5px;margin-bottom:18px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--note) 26%,transparent);
}
.okbox{
  background:var(--good-wash);color:var(--good);
  padding:14px 18px;border-radius:var(--r);font-size:13.5px;margin-bottom:18px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--good) 26%,transparent);
}

/* ========== 弹窗（真实浮层，用深色遮罩而非模糊） ========== */
.mask{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(4,5,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  animation:fade .22s var(--t);
}
@keyframes fade{from{opacity:0}}
.modal{
  background:var(--raised);border-radius:var(--r);padding:26px 28px;
  width:440px;max-width:100%;max-height:86svh;overflow-y:auto;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);
  animation:pop .3s var(--t-out);
}
@keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}}
.modal h3{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:8px}
.modal .foot{margin-top:24px;display:flex;justify-content:flex-end;gap:10px}
.d-none{display:none!important}

/* ========== PIN 锁屏 ========== */
.lockmask{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background:color-mix(in srgb,var(--base) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:fade .26s var(--t);
}
.lockcard{
  background:var(--raised);border-radius:var(--r);padding:34px 30px;
  width:330px;max-width:100%;text-align:center;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);
}
.lockico{
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;border-radius:var(--r-sm);
  background:var(--accent);color:var(--on-accent);
  font-size:12.5px;font-weight:700;letter-spacing:.12em;
  box-shadow:0 0 26px -6px color-mix(in srgb,var(--accent) 80%,transparent);
}
.lockcard h3{margin-bottom:2px;font-size:17px;font-weight:650}
.lockcard .input{margin-top:16px;text-align:center;letter-spacing:.32em;font-size:19px}
.lockerr{color:var(--action);font-size:13px;min-height:20px;margin-top:8px}
.lockshake{animation:shake .3s var(--t)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ========== 浮动提示 ========== */
#toast{
  position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(16px);z-index:210;
  background:var(--toast-bg);color:var(--toast-fg);
  padding:11px 22px;border-radius:99px;font-size:13.5px;font-weight:600;
  box-shadow:0 20px 50px -18px rgba(0,0,0,.9),0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent);
  opacity:0;pointer-events:none;
  transition:opacity .26s var(--t),transform .3s var(--t-out);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== 响应式 ========== */
@media(max-width:1100px){
  .topbar{padding:26px 30px 12px}
  .content{padding:10px 30px 120px}
}
@media(max-width:900px){
  .cc-card:nth-child(1),.cc-card:nth-child(4){grid-column:span 12}
  .cc-card:nth-child(2),.cc-card:nth-child(3){grid-column:span 6}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{
    width:auto;height:auto;position:relative;z-index:5;
    flex-direction:row;align-items:center;padding:11px 14px;gap:4px;
    background:var(--surface);
    box-shadow:0 1px 0 0 rgba(255,255,255,.045);
  }
  .logo{padding:0 14px 0 0}
  .nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;flex:1;gap:2px}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px;font-size:13.5px}
  .nav button::before{display:none}
  .nav button:hover{transform:none}
  .side-foot{display:none}
  .topbar{padding:18px 18px 10px}
  .content{padding:8px 18px 100px}
  .card{padding:22px 20px}
}
@media(max-width:620px){
  .cc-card:nth-child(1),.cc-card:nth-child(2),.cc-card:nth-child(3),.cc-card:nth-child(4){grid-column:span 12}
  .g2,.g3,.g4,.board{grid-template-columns:1fr}
  .tabs{width:100%}
  .dcalnav .d{min-width:auto}
  .content{padding:6px 14px 90px}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
}

/* ================================================================
   入场编排：渐进增强
   data-reveal 由 JS 添加；无 JS 时元素保持默认可见
   ================================================================ */
@media(prefers-reduced-motion:no-preference){
  [data-reveal]{opacity:0;transform:translateY(16px)}
  [data-reveal].is-in{
    opacity:1;transform:none;
    transition:opacity .62s var(--t-out),transform .72s var(--t-out);
    transition-delay:var(--rd,0ms);
  }
}
/* 过渡层：深色优先，主题选择控件不再有意义，隐藏以免误导 */
#setTheme{display:none!important}
label.fl:has(+ #setTheme){display:none!important}

/* 图标位：emoji 已由增强层换成单色线性图标 */
.ic{display:inline-flex;align-items:center;vertical-align:-.14em;color:currentColor}
.ic svg{display:block}

/* ================================================================
   响应式补充
   ================================================================ */
@media(max-width:1180px){
  .topbar{padding:26px 30px 14px}
  .content{padding:12px 30px 130px}
}
@media(max-width:960px){
  .cc-card:nth-child(1),.cc-card:nth-child(4){grid-column:span 12}
  .cc-card:nth-child(2),.cc-card:nth-child(3){grid-column:span 6}
}
@media(max-width:860px){
  /* 这一段只有一条粘性元素：顶栏。导航行改为随页面滚走（见上），
     否则两层粘性叠起来会在滚动到底时压住页面标题。 */
  .topbar{padding:16px 18px 12px;gap:10px}
  .content{padding:12px 18px 110px}
  .card{padding:20px 18px}
  .logo{padding:0 14px 0 0;font-size:14.5px}
  .side-foot{display:none}
  .atmos::before,.atmos::after{opacity:.34}
}
@media(max-width:640px){
  /* 窄屏上任何粘性元素都会吃掉本就紧张的首屏高度，全部取消 */
  .topbar{position:static;backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent;box-shadow:none}
  .cc-card:nth-child(1),.cc-card:nth-child(2),.cc-card:nth-child(3),.cc-card:nth-child(4){grid-column:span 12}
  .g2,.g3,.g4,.board{grid-template-columns:1fr}
  .tabs{width:100%;overflow-x:auto}
  .dcalnav .d{min-width:auto}
  .cc-hd h2{letter-spacing:-.03em}
  #cursorGlow{display:none}
}
@media(prefers-reduced-motion:reduce){
  .atmos::before,.atmos::after{animation:none}
  #cursorGlow{display:none}
}
@media(hover:none){
  .cc-card{transform:none}
  .cc-card::before{display:none}
  #cursorGlow{display:none}
}
/* ================================================================
   首屏伙伴：真实照片的立体交互框（由增强层注入）
   ================================================================ */
#heroBuddy{position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  width:320px;height:400px;pointer-events:none;z-index:2}
.hb-frame{width:100%;height:100%;border-radius:46% 46% 40% 40%/40% 40% 34% 34%;
  overflow:hidden;transition:box-shadow .3s var(--t);
  -webkit-mask-image:radial-gradient(78% 78% at 50% 42%,#000 52%,transparent 100%);
  mask-image:radial-gradient(78% 78% at 50% 42%,#000 52%,transparent 100%)}
.hb-inner{position:relative;width:100%;height:100%;will-change:transform;
  transform-style:preserve-3d;transition:transform .12s linear}
.hb-photo{width:100%;height:100%;object-fit:cover;object-position:50% 22%;
  display:block;filter:saturate(1.04) contrast(1.03)}
.hb-glare{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.10),rgba(255,255,255,0) 62%);
  mix-blend-mode:screen}
/* 照片底部渐隐，融进深色底而不是一刀切 */
#heroBuddy::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(180deg,transparent,#08090c 92%);pointer-events:none;border-radius:0 0 40% 40%}
@media(max-width:1180px){
  #heroBuddy{width:250px;height:312px;right:-10px}
}
@media(max-width:860px){
  #heroBuddy{width:180px;height:224px;right:-8px;opacity:.95}
}
@media(max-width:640px){
  #heroBuddy{width:128px;height:160px;right:0;top:-6px;transform:none;opacity:.9}
}

/* ================================================================
   首页：第一屏 —— 问候语 + 今日计划卡
   ================================================================ */
.cc-greet{font-size:clamp(34px,4.4vw,60px);font-weight:700;letter-spacing:-.042em;
  line-height:1.04;color:var(--ink-strong);
  background:linear-gradient(178deg,#ffffff 34%,#b9c2d6 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.cc-hero{position:relative;min-height:calc(100svh - 96px);display:flex;flex-direction:column;
  justify-content:center;padding:8px 0 40px}

.cc-plan-card{position:relative;z-index:1;background:var(--surface);border-radius:var(--r);
  padding:22px 24px;max-width:620px}
.cc-plan-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.cc-plan-head h3{font-size:15px;font-weight:650;color:var(--ink)}
.cc-plan-head .cnt{font-variant-numeric:tabular-nums;color:var(--accent-ink);font-weight:650;font-size:13.5px}
.cc-plan-head .sub{color:var(--ink-faint);font-size:12.5px;margin-left:auto}

.cc-todo{list-style:none;margin:14px 0 0;max-height:min(34vh,300px);overflow-y:auto;
  padding-right:4px;scrollbar-width:thin}
.cc-todo li{display:flex;align-items:flex-start;gap:11px;padding:9px 2px;
  border-bottom:1px solid var(--rule)}
.cc-todo li:last-child{border-bottom:none}
.cc-todo li.done .tx{color:var(--ink-faint);text-decoration:line-through}
.cc-todo .ck{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex:none}
.cc-todo .tx{flex:1;min-width:0;font-size:14.5px;line-height:1.5}
.cc-todo .tm{flex:none;font-size:12px;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;padding-top:2px}
.cc-todo .empty-row{color:var(--ink-faint);font-size:13.5px;padding:16px 2px;text-align:center;
  border-bottom:none;display:block}

/* 内联快速添加：回车即存 */
.cc-quickadd{display:flex;gap:8px;margin-top:14px}
.cc-quickadd input{flex:1;min-width:0;padding:10px 12px;border-radius:var(--r-sm);outline:none;
  background:var(--sunken);border:1px solid transparent;color:var(--ink);font-size:14px;
  transition:border-color .2s var(--t),background .2s var(--t),box-shadow .2s var(--t)}
.cc-quickadd input::placeholder{color:var(--ink-faint)}
.cc-quickadd input:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  background:var(--raised);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}

.cc-more-link{display:inline-flex;align-items:center;gap:5px;margin-top:14px;
  font-size:13px;color:var(--ink-mute);transition:color .2s var(--t),gap .2s var(--t)}
.cc-more-link:hover{color:var(--accent-ink);gap:9px}

/* ================================================================
   首页：导语（滚动揭示，用 CSS mask 实现，文本在 DOM 里只有一份）
   ================================================================ */
.cc-lead{margin:6px 0 88px;font-size:clamp(19px,2.2vw,27px);font-weight:300;
  letter-spacing:-.012em;line-height:1.5;color:var(--ink-mute);max-width:34ch}

/* ================================================================
   首页：第二屏 —— 日历 + 当日待办（首页直接写，不跳页）
   ================================================================ */
.cc-cal-screen{padding:8px 0 96px}
.cc-cal-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.cc-cal-head .mon{font-size:19px;font-weight:650;letter-spacing:-.01em;
  color:var(--ink-strong);font-variant-numeric:tabular-nums}
.cc-cal-head .nav-btn{width:34px;height:34px;border-radius:var(--r-sm);background:var(--raised);
  color:var(--ink-mute);display:grid;place-items:center;font-size:15px;
  transition:background .2s var(--t),color .2s var(--t)}
.cc-cal-head .nav-btn:hover{background:color-mix(in srgb,var(--accent) 18%,var(--raised));color:var(--ink)}
.cc-cal-head .today-btn{margin-left:auto;padding:7px 14px;border-radius:99px;
  background:var(--accent-wash);color:var(--accent-ink);font-size:12.5px;font-weight:600;
  transition:background .2s var(--t)}
.cc-cal-head .today-btn:hover{background:color-mix(in srgb,var(--accent) 26%,transparent)}

.cc-cal-wrap{background:var(--surface);border-radius:var(--r);padding:18px;max-width:560px}
.cc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cc-cal-hd{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-faint);padding:6px 0}
.cc-cal-d{position:relative;aspect-ratio:1/1;border-radius:var(--r-sm);border:none;
  background:transparent;color:var(--ink);font-size:13.5px;cursor:pointer;padding:0;
  font-variant-numeric:tabular-nums;
  transition:background .18s var(--t),color .18s var(--t),transform .18s var(--t-out)}
.cc-cal-d:hover{background:var(--raised);transform:scale(1.06)}
.cc-cal-d.out{color:var(--ink-faint);opacity:.4}
.cc-cal-d.td{background:var(--accent-wash);color:var(--accent-ink);font-weight:650}
.cc-cal-d.sel{background:var(--accent);color:var(--on-accent);font-weight:650;
  box-shadow:0 0 18px -4px color-mix(in srgb,var(--accent) 80%,transparent)}
.cc-cal-d.has::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--good)}
.cc-cal-d.sel::after{background:var(--on-accent)}

.cc-day-panel{margin-top:18px;max-width:560px}
.cc-day-panel h3{font-size:14px;font-weight:650;color:var(--ink);margin-bottom:4px}
.cc-day-panel .hint{font-size:12.5px;color:var(--ink-faint);margin-bottom:12px}

/* ================================================================
   首页：第三屏起 —— 四张入口卡滚动堆叠
   ================================================================ */
.cc-stack{padding:0 0 120px;max-width:760px}
.cc-stack-item{position:sticky;margin-bottom:18px;
  transform-origin:50% 0%}
.cc-stack-item .cc-card{display:flex;flex-direction:column;align-items:flex-start;
  gap:8px;text-align:left;width:100%;padding:26px 28px;
  transform:none!important}
.cc-stack-item .cc-card .cc-name{font-size:15px}
.cc-stack-item .cc-card .cc-status{font-size:clamp(28px,3vw,38px)}
@media(prefers-reduced-motion:reduce){
  .cc-stack-item{position:static;transform:none!important}
}

/* ========== 侧边导航（与纸面对比的素面栏） ========== */
.side{
  width:236px;flex-shrink:0;height:100svh;position:sticky;top:0;
  display:flex;flex-direction:column;
  padding:36px 22px 26px;background:var(--surface);
}
.logo{font-size:16px;font-weight:700;letter-spacing:-.01em;padding:0 12px 30px;display:flex;align-items:center;gap:11px}
.logo .dot{width:11px;height:11px;border-radius:var(--r);background:var(--accent);flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;padding:0}
.nav button{
  display:block;width:100%;text-align:left;padding:11px 12px;border-radius:var(--r);
  color:var(--ink-soft);font-weight:500;
  transition:color .18s var(--t),background .18s var(--t);
}
.nav button:hover{color:var(--ink);background:var(--sunken)}
.nav button.on{color:var(--accent-ink);font-weight:650;background:var(--accent-wash)}
.side-foot{margin-top:auto;padding:22px 12px 0;font-size:13px;color:var(--ink-soft);line-height:1.75}

/* ========== 主区域 ========== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:30px 56px 14px;display:flex;align-items:baseline;gap:14px;
}
.topbar h1{font-size:15px;font-weight:600;color:var(--ink-soft)}
.topbar .sub{color:var(--ink-soft);font-size:13px}
.content{padding:10px 56px 140px;max-width:1040px;width:100%}

/* ========== 通用组件 ========== */
.card{background:var(--surface);border-radius:var(--r);padding:28px 30px;margin-bottom:20px}
.card h3{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.card h3 .cnt{color:var(--ink-soft);font-weight:400;font-size:13px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink-soft)}
.small{font-size:13px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:var(--r);
  background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;
  transition:background .18s var(--t),transform .12s var(--t);
}
.btn:hover{background:var(--accent-deep)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--sunken);color:var(--ink)}
.btn.ghost:hover{background:color-mix(in srgb,var(--ink) 15%,var(--sunken));color:var(--ink)}
.btn.danger{background:transparent;color:var(--action);padding:8px 10px}
.btn.danger:hover{background:var(--action-wash)}
.btn.sm{padding:7px 13px;font-size:13.5px}
.btn.lg{padding:14px 24px;font-size:15px}
.btn.icon{padding:7px 13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border-radius:var(--r);outline:none;
  background:var(--sunken);border:1px solid transparent;color:var(--ink);
  transition:border-color .18s var(--t),background .18s var(--t);
}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--accent);background:var(--surface)}
textarea.input{resize:vertical;min-height:110px;line-height:1.8}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:16px 0 7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r);font-size:12.5px;font-weight:600;background:var(--accent-wash);color:var(--accent-ink)}
.chip.gray{background:var(--sunken);color:var(--ink-soft)}
.chip.warn{background:var(--note-wash);color:var(--note)}
.chip.ok{background:var(--good-wash);color:var(--good)}
.chip.danger{background:var(--action-wash);color:var(--action)}
.pg{height:8px;border-radius:var(--r);background:var(--sunken);overflow:hidden}
.pg>i{display:block;height:100%;background:var(--accent);transition:width .4s var(--t)}
.empty{text-align:center;padding:34px 10px;color:var(--ink-soft);font-size:14px}
.empty .ei{display:none}
.divider{margin:24px 0}
.hr-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.hr-row h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
.stat{text-align:left}
.stat .n{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--ink-soft);margin-top:4px}

/* 列表条目：只用留白分隔，不画线 */
.item{display:flex;align-items:flex-start;gap:12px;padding:15px 0}
.item .ck{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.item .tx{flex:1;min-width:0}
.item.done .tx{text-decoration:line-through;color:var(--ink-soft)}
.item .meta{margin-top:5px;font-size:13px;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ========== 首页：今日总览 ========== */
.cc-hero{margin-bottom:36px}
.cc-hd{margin-bottom:34px}
.cc-hd h2{font-size:clamp(38px,6vw,80px);font-weight:700;letter-spacing:-.035em;line-height:1.06;color:var(--ink)}
.cc-day{margin-top:14px;font-size:14px;color:var(--ink-soft)}
.cc-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.cc-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;
  padding:26px 24px;border-radius:var(--r);background:var(--surface);color:var(--ink);
  transition:background .18s var(--t),transform .18s var(--t);
}
.cc-card:hover{background:var(--sunken)}
.cc-card:active{transform:translateY(1px)}
.cc-card:nth-child(1){grid-column:span 7}
.cc-card:nth-child(2){grid-column:span 5}
.cc-card:nth-child(3){grid-column:span 5}
.cc-card:nth-child(4){grid-column:span 7}
.cc-card .cc-name{font-size:14px;font-weight:600;color:var(--ink-soft)}
.cc-card .cc-status{font-size:clamp(30px,3.6vw,44px);font-weight:700;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.cc-card .cc-status.txt{font-size:clamp(20px,2.2vw,26px);letter-spacing:-.01em}
.cc-card .cc-note{font-size:14px;color:var(--ink-soft)}
.cc-card .cc-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.cc-card .pg{width:100%;margin-top:6px}
.cc-acts{margin-bottom:34px;display:flex;gap:10px;flex-wrap:wrap}

/* 入场编排：标题与面板内文字依次浮现（只动 transform / opacity） */
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes riseSm{from{opacity:0;transform:translateY(8px)}}
.cc-hd h2{animation:rise .6s var(--t) backwards}
.cc-day{animation:rise .6s var(--t) .08s backwards}
.cc-card>*{animation:riseSm .5s var(--t) backwards}
.cc-card>*:nth-child(1){animation-delay:.10s}
.cc-card>*:nth-child(2){animation-delay:.17s}
.cc-card>*:nth-child(3){animation-delay:.24s}
.cc-card>*:nth-child(4){animation-delay:.31s}
.cc-card>*:nth-child(5){animation-delay:.38s}

/* ========== 看板 ========== */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.board{grid-template-columns:1fr 1fr}}
.col{background:var(--sunken);border-radius:var(--r);padding:14px;min-height:120px}
.col h4{font-size:12.5px;margin-bottom:12px;display:flex;justify-content:space-between;color:var(--ink-soft);font-weight:650}
.pcard{background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;transition:background .18s var(--t)}
.pcard:hover{background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.pcard .tt{font-weight:600;font-size:14px;word-break:break-all}
.pcard .meta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pcard .acts{margin-top:9px;display:flex;gap:6px}

/* ========== 习惯格 ========== */
.dots{display:inline-flex;gap:5px;margin:0 6px}
.dot{width:22px;height:22px;border-radius:var(--r);background:var(--sunken);color:var(--ink-soft);font-size:11px;display:flex;align-items:center;justify-content:center}
.dot.on{background:var(--accent);color:var(--on-accent);font-weight:650}
.habit-name{flex:1;font-weight:600}

/* ========== 计时器 ========== */
.timer-wrap{text-align:center;padding:16px 0 6px}
.timer{font-size:58px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer-btns{margin-top:18px;display:flex;gap:10px;justify-content:center}

/* ========== 图表 / 表格 / 分段控件 ========== */
.chart{width:100%;height:auto;display:block}
.ax{fill:var(--ink-soft);font-size:11px}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left}
table.tb th{color:var(--ink-soft);font-weight:600;font-size:13px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:var(--r);margin-bottom:22px;width:fit-content;background:var(--sunken)}
.tabs button{padding:8px 18px;border-radius:var(--r);font-size:14px;color:var(--ink-soft);font-weight:600;transition:background .18s var(--t),color .18s var(--t)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:650}
.date-nav{display:flex;align-items:center;gap:10px}
.date-nav .d{min-width:180px;text-align:center;font-weight:650}
.cup{display:inline-block;width:24px;height:24px;border-radius:var(--r);background:var(--sunken);cursor:pointer;transition:background .18s var(--t),transform .18s var(--t)}
.cup:hover{transform:translateY(-2px)}
.cup:active{transform:translateY(0)}
.cup.on{background:var(--accent)}
.cup.off{background:var(--sunken)}
.stars{color:var(--note);letter-spacing:2px}

/* ========== 日记月历 ========== */
.dcalbox{background:var(--surface);border-radius:var(--r);padding:16px;margin:0 0 20px}
.dcalnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:14px}
.dcalnav .btn{width:36px}
.dcalgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dcalhd{text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);padding:4px 0}
.dcal{position:relative;aspect-ratio:1/1;border-radius:var(--r);background:transparent;color:var(--ink);font-size:14px;cursor:pointer;padding:0;transition:background .18s var(--t)}
.dcal:hover{background:var(--sunken)}
.dcal:active{transform:scale(.96)}
.dcal.out{color:var(--ink-soft);opacity:.5}
.dcal i{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--good)}
.dcal.has{background:var(--good-wash);font-weight:650}
.dcal.td{background:var(--accent-wash);color:var(--accent-ink);font-weight:650}
.dcal.sel{background:var(--accent);color:var(--on-accent);font-weight:650}
.dcal.sel i{background:var(--on-accent)}

/* ========== 习惯热力图 ========== */
.heatgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hhead{font-style:normal;text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);padding:2px 0}
.hcell{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;border-radius:var(--r);font-size:12.5px;font-style:normal;background:var(--sunken);color:var(--ink-soft)}
.hcell.blank{background:transparent}
.hcell.l1{background:color-mix(in srgb,var(--good) 26%,var(--paper));color:var(--ink)}
.hcell.l2{background:color-mix(in srgb,var(--good) 46%,var(--paper));color:var(--on-accent)}
.hcell.l3{background:color-mix(in srgb,var(--good) 70%,var(--paper));color:var(--on-accent)}
.hcell.l4{background:var(--good);color:var(--on-accent)}
.hcell.sm{width:18px;height:18px;aspect-ratio:auto}
.heatlegend{display:flex;align-items:center;gap:5px;margin-top:12px}

/* ========== 周报告柱状图 ========== */
.bw{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:160px;padding:12px 4px 0;border-bottom:1px solid var(--rule)}/* taste-skill-ignore: 柱状图基线，属于数据图形 */
.bwcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bwnum{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;min-height:16px}
.bwbar{width:72%;min-height:0;border-radius:var(--r) var(--r) 0 0;background:var(--accent);transition:height .4s var(--t)}
.bwbar.today{background:var(--note)}
.bwlbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px}

/* ========== 日记配图 ========== */
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.ph{position:relative;width:108px;height:108px;border-radius:var(--r);overflow:hidden;background:var(--sunken)}
.phimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--sunken)}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.phdel{
  position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:var(--r);
  background:var(--ink);color:var(--paper);font-size:14px;line-height:1;z-index:1;cursor:pointer;
  transition:opacity .18s var(--t);
}
.phdel:hover{opacity:.78}

/* ========== 提示条：用实心色块表达状态 ========== */
.warnbox{background:var(--note-wash);color:var(--note);padding:14px 18px;border-radius:var(--r);font-size:14px;margin-bottom:20px}
.okbox{background:var(--good-wash);color:var(--good);padding:14px 18px;border-radius:var(--r);font-size:14px;margin-bottom:20px}

/* ========== 弹窗（真实浮层，用深色遮罩而非模糊） ========== */
.mask{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(18,16,14,.5);animation:fade .2s var(--t)}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r);padding:28px 30px;width:440px;max-width:100%;max-height:86svh;overflow-y:auto;animation:pop .24s var(--t)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal h3{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-bottom:8px}
.modal .foot{margin-top:24px;display:flex;justify-content:flex-end;gap:10px}
.d-none{display:none!important}

/* ========== PIN 锁屏 ========== */
.lockmask{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:color-mix(in srgb,var(--paper) 94%,transparent);animation:fade .24s var(--t)}
.lockcard{background:var(--surface);border-radius:var(--r);padding:34px 30px;width:330px;max-width:100%;text-align:center}
.lockico{
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);
  font-size:13px;font-weight:700;letter-spacing:.12em;
}
.lockcard h3{margin-bottom:2px;font-size:17px;font-weight:650}
.lockcard .input{margin-top:16px;text-align:center;letter-spacing:.32em;font-size:19px}
.lockerr{color:var(--action);font-size:13px;min-height:20px;margin-top:8px}
.lockshake{animation:shake .3s var(--t)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ========== 浮动提示 ========== */
#toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(16px);z-index:210;
  background:var(--toast-bg);color:var(--toast-fg);
  padding:11px 22px;border-radius:var(--r);font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .22s var(--t),transform .24s var(--t);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== 响应式 ========== */
@media(max-width:1100px){
  .topbar{padding:26px 30px 12px}
  .content{padding:10px 30px 120px}
}
@media(max-width:900px){
  .cc-card:nth-child(1),.cc-card:nth-child(4){grid-column:span 12}
  .cc-card:nth-child(2),.cc-card:nth-child(3){grid-column:span 6}
}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{
    width:auto;height:auto;position:sticky;top:0;z-index:30;
    flex-direction:row;align-items:center;padding:12px 16px;gap:4px;
  }
  .logo{padding:0 14px 0 0}
  .nav{flex-direction:row;overflow-x:auto;overflow-y:hidden;flex:1;gap:2px}
  .nav button{width:auto;white-space:nowrap;padding:9px 12px}
  .side-foot{display:none}
  .topbar{padding:18px 18px 10px}
  .content{padding:8px 18px 100px}
  .card{padding:22px 20px}
}
@media(max-width:620px){
  .cc-card:nth-child(1),.cc-card:nth-child(2),.cc-card:nth-child(3),.cc-card:nth-child(4){grid-column:span 12}
  .g2,.g3,.g4,.board{grid-template-columns:1fr}
  .tabs{width:100%}
  .dcalnav .d{min-width:auto}
  .content{padding:6px 14px 90px}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
}

</style>

<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="dot"></span>我的生活助手</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">数据保存在本机浏览器<br>清理浏览器数据前请先备份</div>
  </aside>
  <div class="main">
    <header class="topbar"><h1 id="viewTitle"></h1><span class="sub" id="viewSub"></span></header>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================================================================
   我的工作生活助手 —— 纯本地单文件版
   存储：localStorage（键 lifeapp_v1）
================================================================ */
const LS='lifeapp_v1';
const CURRENT_V=2;                 // 当前数据结构版本
/* 启动最早期可用的当天日期（defaultState/migrate 早于 const today 初始化，不能用 today） */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const BACKUP_SIZE_LIMIT=10*1024*1024; // 纯数据备份建议上限 10MB
const IMPORT_SIZE_LIMIT=50*1024*1024; // 含图片备份的导入上限 50MB
const PHOTO_SIZE_LIMIT=8*1024*1024;   // 单张配图上限 8MB

/* ---------- 5.1 IndexedDB 图片存储（日记配图：二进制不占用 localStorage） ---------- */
const IDB_NAME='lifeapp_imgs', IDB_STORE='images';
let _idbPromise=null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise=new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('当前浏览器不支持 IndexedDB')); return; }
    const rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'id'}); };
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
  return _idbPromise;
}
function idbReq(store,mode,fn){
  return idbOpen().then(db=>new Promise((res,rej)=>{
    const rq=fn(db.transaction(IDB_STORE,mode).objectStore(IDB_STORE));
    rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
  }));
}
function idbPut(id,blob){ return idbReq(null,'readwrite',st=>st.put({id,blob,addedAt:Date.now()})); }
function idbGet(id){ return idbReq(null,'readonly',st=>st.get(id)).then(r=>(r&&r.blob)||null); }
function idbDel(id){ return idbReq(null,'readwrite',st=>st.delete(id)); }
function idbClear(){ return idbOpen().then(db=>new Promise((res,rej)=>{ const rq=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).clear(); rq.onsuccess=()=>res(); rq.onerror=()=>rej(rq.error); })).catch(()=>{}); }
/* 导出备份用：全部图片转 dataURL */
function idbExportAll(){
  return idbReq(null,'readonly',st=>st.getAll()).then(rows=>Promise.all(rows.map(r=>new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>res([r.id,fr.result]); fr.onerror=()=>res([r.id,null]);
    fr.readAsDataURL(r.blob);
  })))).then(pairs=>{ const o={}; pairs.forEach(([k,v])=>{ if(v)o[k]=v; }); return o; }).catch(()=>({}));
}
function dataURLtoBlob(du){
  const m=/^data:(.*?)(;base64)?,/.exec(du||'')||[];
  const mime=m[1]||'image/png';
  const bin=atob((du||'').split(',')[1]||'');
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

/* ---------- 数据结构迁移：旧版本逐步升级到当前版本 ---------- */
function migrate(raw){
  if(!raw||typeof raw!=='object') throw new Error('备份不是有效的数据对象');
  if(typeof raw.v!=='number') throw new Error('备份缺少版本号');
  if(raw.v>CURRENT_V) throw new Error('备份版本比当前程序更新，请使用新版本打开');
  if(raw.v<1) throw new Error('备份版本不受支持');
  const s=raw;
  /* v1 -> v2：餐饮增加餐次分组、自媒体内容增加正文字段、增加任务模板库 */
  if(s.v===1){
    if(s.diet&&s.diet.meals){
      Object.values(s.diet.meals).forEach(list=>Array.isArray(list)&&list.forEach(m=>{ if(!m.mealType) m.mealType='午餐'; }));
    }
    if(s.media&&Array.isArray(s.media.posts)) s.media.posts.forEach(p=>{ if(p.content===undefined) p.content=''; });
    if(!Array.isArray(s.taskTemplates)) s.taskTemplates=[];
    s.v=2;
  }
  /* v5.2 备份提醒：旧数据缺 meta / 新设置项时补齐（不改变版本号） */
  if(!s.meta||typeof s.meta!=='object') s.meta={firstUse:todayStr(),lastBackup:'',notifyDate:'',snoozeDate:''};
  ['firstUse','lastBackup','notifyDate','snoozeDate'].forEach(k=>{ if(typeof s.meta[k]!=='string') s.meta[k]=''; });
  if(!s.meta.firstUse) s.meta.firstUse=todayStr();
  if(!s.settings||typeof s.settings!=='object') s.settings={};
  if(typeof s.settings.backupRemind!=='boolean') s.settings.backupRemind=true;
  if(typeof s.settings.backupDays!=='number'||!(s.settings.backupDays>0)) s.settings.backupDays=14;
  /* v5.3 PIN 锁屏 */
  if(typeof s.settings.pinLock!=='boolean') s.settings.pinLock=false;
  if(typeof s.settings.pin!=='string') s.settings.pin='';
  return s;
}

/* ---------- 备份解析（导入与校验共用） ---------- */
function parseBackup(text){
  if(typeof text!=='string'||!text.trim()) throw new Error('文件内容为空');
  let raw;
  try{ raw=JSON.parse(text); }catch(e){ throw new Error('文件不是有效的 JSON'); }
  const s=migrate(raw);

  if(!s.settings||!s.diet||!s.games||!s.fitness||!s.media) throw new Error('文件内容不是本应用的备份');
  return s;
}

/* ---------- 5.2 备份提醒（纯函数可测：基准=上次导出日，从未导出则用首次使用日） ---------- */
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function backupReminder(now){
  now=now||today();
  const interval=Math.max(1,Number(S.settings.backupDays)||14);
  const enabled=S.settings.backupRemind!==false;
  const meta=S.meta||{};
  const last=meta.lastBackup||'';
  const base=last||meta.firstUse||now;
  const days=daysBetween(base,now);
  const snoozed=meta.snoozeDate===now;
  return {enabled, interval, lastBackup:last, days, overdue:enabled&&days>=interval, snoozed};
}

function openModal(title,fields,onMount){

    document.body.appendChild(wrap);
    const focusEl=wrap.querySelector('[data-key]'); if(focusEl)focusEl.focus();
    if(onMount) onMount(wrap);
    const done=v=>{ wrap.remove(); document.removeEventListener('keydown',escClose); resolve(v); };
    function escClose(e){ if(e.key==='Escape') done(null); }
    document.addEventListener('keydown',escClose);
    wrap.addEventListener('click',e=>{ if(e.target===wrap) done(null); });
    wrap.querySelector('#mcancel').onclick=()=>done(null);
    wrap.querySelector('#mform').onsubmit=e=>{
      e.preventDefault();

      for(const f of fields){
        if(f.required&&!String(v[f.key]??'').trim()){ toast('请填写：'+f.label); return; }
      }
      done(v);

/* ---------- 折线图（opts.goal 可画目标虚线） ---------- */
function lineChart(points,unit,opts){
  opts=opts||{};
  if(points.length<2) return '<div class="empty"><span class="ei"></span>再记录一条即可看到趋势</div>';
  const W=320,H=120,P=28;
  let ys=points.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys);
  if(opts.goal!=null){ mn=Math.min(mn,opts.goal); mx=Math.max(mx,opts.goal); }
  const span=(mx-mn)||1;
  const yOf=v=>H-P-(v-mn)/span*(H-2*P)-4;
  const xy=points.map((p,i)=>[P+i*(W-2*P)/(points.length-1), yOf(p.y)]);
  const goalLine=(opts.goal!=null)?`<line x1="${P}" y1="${yOf(opts.goal).toFixed(1)}" x2="${W-P+4}" y2="${yOf(opts.goal).toFixed(1)}" stroke="var(--danger)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="${W-P+2}" y="${(yOf(opts.goal)-3).toFixed(1)}" text-anchor="end" class="ax" style="fill:var(--danger)">目标 ${opts.goal}${unit||''}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="none" style="max-height:220px">
    ${goalLine}
    <polyline points="${xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${xy.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${points[i].over?'var(--danger)':'var(--primary)'}"/>`).join('')}
    <text x="4" y="16" class="ax">${mx}${unit||''}</text><text x="4" y="${H-10}" class="ax">${mn}${unit||''}</text>
  </svg>
  <div class="small muted" style="display:flex;justify-content:space-between;margin-top:2px"><span>${md(points[0].x)}</span><span>${md(points[points.length-1].x)}</span></div>`;
}

function calEnsure(t){
  if(!homeCal.view) homeCal.view=t.slice(0,7)+'-01';
  if(!homeCal.sel) homeCal.sel=t;
}
function calPad(y,m,d){
  while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function calCells(view){
  const y=+view.slice(0,4), m=+view.slice(5,7);
  const firstWd=(new Date(y,m-1,1).getDay()+6)%7;   /* 周一为每周首 */
  const dim=new Date(y,m,0).getDate();
  const prevDim=new Date(y,m-1,0).getDate();
  const cells=[];
  for(let i=firstWd-1;i>=0;i--) cells.push({d:calPad(y,m-1,prevDim-i),out:true});
  for(let d=1;d<=dim;d++) cells.push({d:calPad(y,m,d),out:false});
  const total=Math.ceil(cells.length/7)*7; let nd=1;
  while(cells.length<total) cells.push({d:calPad(y,m+1,nd++),out:true});
  return cells;
}

function medKick(){
  clearInterval(medTimer);
  medStart=medSavedStart()||Date.now();
  if(!medSavedStart()) sessionStorage.setItem(MED_KEY,String(medStart));
  const paint=()=>{ medTick=Math.max(0,Math.floor((Date.now()-medStart)/1000)); const el=$('#mt'); if(el) el.textContent=medFmt(medTick); };
  paint();
  medTimer=setInterval(paint,500);
}

/* 习惯月度热力图（GitHub 风格，颜色深浅=当天完成习惯比例） */
function habitHeatmap(){
  const ym=ui.habYM||today().slice(0,7);
  const [Y,M]=ym.split('-').map(Number);
  const total=S.habits.length;
  const offset=(new Date(Y,M-1,1).getDay()+6)%7; // 周一开头
  const dim=new Date(Y,M,0).getDate();
  let html='';
  for(let i=0;i<offset;i++) html+='<i class="hcell blank"></i>';
  let checked=0, full=0;
  for(let day=1;day<=dim;day++){
    const ds=ym+'-'+pad(day);
    const done=total?S.habits.reduce((a,h)=>a+(h.checks.includes(ds)?1:0),0):0;
    const lvl=(!total||done===0)?0:Math.max(1,Math.ceil(done/total*4));
    if(done>0) checked++;
    if(total&&done===total) full++;
    html+=`<i class="hcell l${lvl}" title="${ds}　完成 ${done}/${total}">${day}</i>`;
  }
  const heads=['一','二','三','四','五','六','日'].map(w=>`<i class="hhead">${w}</i>`).join('');
  return `<div class="card">
    <div class="dcalnav">
      <h3 style="margin:0;font-size:15px"> ${Y} 年 ${M} 月打卡热力图</h3>
      <span>

/* 4.4 娱乐时长周报告：本周每天 + 总计 + 与上周对比 */
function renderGameReport(){
  const ws=weekStartOf(today());
  const thisWeek=Array.from({length:7},(_,i)=>({d:addDays(ws,i),m:gameMins(addDays(ws,i))}));
  const lastWs=addDays(ws,-7);
  const lastWeek=Array.from({length:7},(_,i)=>gameMins(addDays(lastWs,i)));
  const sum=thisWeek.reduce((a,x)=>a+x.m,0);
  const lastSum=lastWeek.reduce((a,b)=>a+b,0);
  const active=thisWeek.filter(x=>x.m>0).length;
  const max=Math.max(60,...thisWeek.map(x=>x.m));
  const diff=sum-lastSum;
  let cmp;
  if(lastSum===0&&sum===0) cmp='两周都还没有娱乐记录';
  else if(lastSum===0) cmp='上周没有记录，本周已娱乐 '+sum+' 分钟';
  else if(diff===0) cmp='与上周持平（'+sum+' 分钟）';
  else{
    const pct=Math.round(Math.abs(diff)/lastSum*100);
    cmp=(diff>0?'比上周多 ':'比上周少 ')+Math.abs(diff)+' 分钟（'+(diff>0?'+':'-')+pct+'%）';
  }
  const bars=thisWeek.map((x,i)=>{
    const w=x.m?Math.max(6,Math.round(x.m/max*100)):0;
    return `<div class="bwcol">
      <div class="bwnum">${x.m||''}</div>
      <div class="bwbar ${x.d===today()?'today':''}" style="height:${w}px" title="${x.d} ${x.m}分钟"></div>
      <div class="bwlbl">${'日一二三四五六'[wdOf(x.d)]}</div>
    </div>`;
  }).join('');
  $('#view').innerHTML=`
  ${gameTabs()}
  <div class="grid g3">
    <div class="card stat"><div class="n">${sum}</div><div class="l">本周娱乐总时长（分钟）</div></div>
    <div class="card stat"><div class="n">${active}</div><div class="l">有娱乐的天数</div></div>
    <div class="card stat"><div class="n" style="color:${diff>0?'var(--danger)':'var(--ok)'}">${diff>0?'+':''}${diff}</div><div class="l">环比上周（分钟）· 上周 ${lastSum}</div></div>
  </div>
  <div class="card"><h3> 本周每天娱乐时长 <span class="cnt">${md(ws)} ~ ${md(addDays(ws,6))}</span></h3>
    <div class="bw">${bars}</div>
    <div class="muted small" style="margin-top:10px">${cmp}</div>
  </div>`;
}

    ${('Notification' in window&&Notification.permission==='default')?'<button class="btn sm ghost" style="margin-top:8px" data-act="notif-enable"> 授权系统通知</button>':''}

    <div class="muted small" style="margin:14px 0 8px"> 需要用 Excel 查看或打印时，可以按模块导出 CSV 表格：</div>

    <div class="grid g2">
      <div><label class="fl">锁屏开关</label><select class="input" id="setPinLock">
        <option value="0" ${s.pinLock===true?'':'selected'}>关闭</option>
