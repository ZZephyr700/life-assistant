    使用方式：双击本文件即可在浏览器中打开；请固定使用同一个浏览器（Edge 或 Chrome）访问，数据保存在该浏览器中。</div>
  </div>`;
};
function applyTheme(){ document.documentElement.dataset.theme='dark'; }

/* ================================================================
   全局事件分发
================================================================ */
document.addEventListener('click',async e=>{
  /* 锁屏期间除解锁按钮外拦截一切操作（含导航） */
  if(locked){
    if(e.target.closest('.lockmask [data-act="lock-unlock"]')) await doAct('lock-unlock');
    return;
  }
  const nav=e.target.closest('[data-nav]');
  if(nav){ go(nav.dataset.nav); return; }
  const b=e.target.closest('[data-act]');
  if(!b) return;
  await doAct(b.dataset.act,b,e);
});
document.addEventListener('change',async e=>{
  if(locked) return;
  const b=e.target.closest('[data-act]');
  if(!b) return;
  await doChange(b.dataset.act,b);
});

async function doAct(a,b){
  const id=b?b.dataset.id:'', d=b?b.dataset.date:'';
  switch(a){
    /* 快速备忘 */
    case'note-add':{
      const inp=$('#quickInput'); const text=(inp?inp.value:'').trim();
      if(!text){ toast('写点内容再保存'); return; }
      S.quickNotes.push({id:uid(),text,t:Date.now(),d:today()}); save(); go('home'); toast('已记下');
      break;
    }
    /* 首页 / 日历的内联添加与切月 */
    case'home-add':{
      const inp=$('#homeQuickAdd');
      const text=(inp?inp.value:'').trim();
      if(!text){ toast('先写点什么'); if(inp)inp.focus(); return; }
      (S.tasks[d||today()]=S.tasks[d||today()]||[]).push({id:uid(),text,time:'',pri:'中',note:'',done:false});
      save(); go('home'); toast('已记下');
      break;
    }
    case'hcal-add':{
      const inp=$('#calQuickAdd');
      const text=(inp?inp.value:'').trim();
      if(!text){ toast('先写点什么'); if(inp)inp.focus(); return; }
      (S.tasks[d]=S.tasks[d]||[]).push({id:uid(),text,time:'',pri:'中',note:'',done:false});
      save(); go('home'); toast('已加到 '+md(d));
      break;
    }
    case'hcal-pick':{ homeCal.sel=d; go('home'); break; }
    case'hcal-prev':{
      const y=+homeCal.view.slice(0,4), m=+homeCal.view.slice(5,7);
      homeCal.view=(m===1?calPad(y-1,12,1):calPad(y,m-1,1)); go('home'); break;
    }
    case'hcal-next':{
      const y=+homeCal.view.slice(0,4), m=+homeCal.view.slice(5,7);
      homeCal.view=(m===12?calPad(y+1,1,1):calPad(y,m+1,1)); go('home'); break;
    }
    case'hcal-today':{ homeCal.view=today().slice(0,7)+'-01'; homeCal.sel=today(); go('home'); break; }
    /* 今日计划 */
    case'task-add':{
      const v=await openModal('添加任务 · '+md(d),[
        {key:'text',label:'要做什么',required:true,placeholder:'例如：写完周报'},
        {key:'time',label:'计划时间（可选）',type:'time'},
        {key:'pri',label:'优先级',type:'select',options:[['中','中'],['高','高'],['低','低']]},
        {key:'note',label:'备注',type:'textarea',placeholder:'补充说明（可选）'}
      ]);
      if(!v) return;
      (S.tasks[d]=S.tasks[d]||[]).push({id:uid(),text:v.text.trim(),time:v.time,pri:v.pri,note:v.note||'',done:false});
      save(); go(cur); toast('已添加');
      break;
    }
    case'task-toggle':{
      const t=S.tasks[b.dataset.date].find(x=>x.id===id); t.done=!t.done; save(); go(cur);
      break;
    }
    case'task-edit':{
      const t=tasksOf(ui.planDate).find(x=>x.id===id);
      const v=await openModal('编辑任务',[
        {key:'text',label:'要做什么',required:true,value:t.text},
        {key:'time',label:'计划时间',type:'time',value:t.time||''},
        {key:'pri',label:'优先级',type:'select',options:[['高','高'],['中','中'],['低','低']],value:t.pri||'中'},
        {key:'note',label:'备注',type:'textarea',value:t.note||''}
      ]);
      if(!v) return;
      Object.assign(t,{text:v.text.trim(),time:v.time,pri:v.pri,note:v.note||''}); save(); go(cur);
      break;
    }
    case'task-del': delConfirm('任务',()=>{S.tasks[ui.planDate]=S.tasks[ui.planDate].filter(x=>x.id!==id);save();go(cur);}); break;
    case'plan-prev': ui.planDate=addDays(ui.planDate,-1); go(cur); break;
    case'plan-next': ui.planDate=addDays(ui.planDate,1); go(cur); break;
    case'plan-today': ui.planDate=today(); go(cur); break;

    /* 任务模板 */
    case'tpl-open': openTplPanel(); break;
    case'tpl-close':{ const w=document.querySelector('#tplMask'); if(w) w.remove(); break; }
    case'tpl-add':{
      const inp=document.querySelector('#tplText');
      const text=inp?inp.value.trim():'';
      if(!text){ toast('先输入模板内容'); break; }
      S.taskTemplates.push({id:uid(),text,time:document.querySelector('#tplTime').value,pri:document.querySelector('#tplPri').value,note:''});
      save(); renderTplPanel(); toast('模板已保存');
      break;
    }
    case'tpl-apply':{
      const t=S.taskTemplates.find(x=>x.id===id);
      if(!t) break;
      const dd=ui.planDate;
      (S.tasks[dd]=S.tasks[dd]||[]).push({id:uid(),text:t.text,time:t.time,pri:t.pri,note:t.note||'',done:false});
      save(); go(cur); renderTplPanel(); toast('已加到 '+md(dd));
      break;
    }
    case'tpl-del':
      S.taskTemplates=S.taskTemplates.filter(x=>x.id!==id); save(); renderTplPanel(); toast('模板已删除'); break;

    /* 自媒体 - 灵感 */
    case'media-tab': ui.mediaTab=b.dataset.v; go(cur); break;
    case'idea-add':{
      const inp=$('#ideaText'); const text=inp.value.trim();
      if(!text){ toast('先写点什么'); return; }
      S.media.ideas.push({id:uid(),text,platform:$('#ideaPlat').value,d:today()}); save(); go(cur); toast('灵感已收藏');
      break;
    }
    case'idea-del': delConfirm('这条灵感',()=>{S.media.ideas=S.media.ideas.filter(x=>x.id!==id);save();go(cur);}); break;
    case'idea-to':{
      const x=S.media.ideas.find(q=>q.id===id);
      S.media.posts.push({id:uid(),title:x.text,platform:x.platform,status:'draft',url:'',views:0,likes:0,comments:0,d:today(),content:''});
      S.media.ideas=S.media.ideas.filter(q=>q.id!==id); save(); ui.mediaTab='board'; go(cur); toast('已转入草稿');
      break;
    }
    /* 自媒体 - 流水线 */
    case'post-add':{
      const v=await openModal('新建内容',[
        {key:'title',label:'内容标题',required:true,placeholder:'例如：居家健身 5 个常见误区'},
        {key:'platform',label:'发布平台',type:'select',options:PLATFORMS.map(p=>[p,p])},
        {key:'status',label:'当前阶段',type:'select',options:PSTATUS.map(x=>[x[0],x[1]]),value:'idea'},
        {key:'content',label:'正文草稿（可选）',type:'textarea',placeholder:'在这里写内容大纲或正文……'}
      ]);
      if(!v) return;
      S.media.posts.push(Object.assign({id:uid(),url:'',views:0,likes:0,comments:0,d:today(),content:''},v,{title:v.title.trim(),content:v.content||''}));
      save(); go(cur); toast('已创建');
      break;
    }
    case'post-move':{
      const p=S.media.posts.find(x=>x.id===id);
      const idx=PSTATUS.findIndex(x=>x[0]===p.status);
      const ni=idx+Number(b.dataset.dir);
      if(ni<0||ni>=PSTATUS.length) return;
      p.status=PSTATUS[ni][0];
      if(p.status==='published'&&!p.pubDate) p.pubDate=today();
      save(); go(cur);
      break;
    }
    case'post-edit':{
      const p=S.media.posts.find(x=>x.id===id);
      const v=await openModal('编辑内容',[
        {key:'title',label:'标题',required:true,value:p.title},
        {key:'platform',label:'平台',type:'select',options:PLATFORMS.map(x=>[x,x]),value:p.platform},
        {key:'status',label:'阶段',type:'select',options:PSTATUS.map(x=>[x[0],x[1]]),value:p.status},
        {key:'url',label:'发布链接（已发布后填）',value:p.url||'',placeholder:'https://'},
        {key:'content',label:'正文 / 草稿',type:'textarea',value:p.content||'',placeholder:'内容大纲或正文'},
        {key:'views',label:'浏览量',type:'number',min:'0',value:p.views||0},
        {key:'likes',label:'点赞数',type:'number',min:'0',value:p.likes||0},
        {key:'comments',label:'评论数',type:'number',min:'0',value:p.comments||0}
      ]);
      if(!v) return;
      Object.assign(p,{title:v.title.trim(),platform:v.platform,status:v.status,url:v.url,content:v.content||'',
        views:Number(v.views)||0,likes:Number(v.likes)||0,comments:Number(v.comments)||0});
      save(); go(cur);
      break;
    }
    case'post-del': delConfirm('这条内容',()=>{S.media.posts=S.media.posts.filter(x=>x.id!==id);save();go(cur);}); break;

    /* 冥想 */
    case'med-start':{
      if(medSavedStart()) return;
      sessionStorage.setItem(MED_KEY,String(Date.now()));
      medKick(); medShowRunning();
      break;
    }
    case'med-stop':{
      if(!medSavedStart()) return;
      const elapsed=Math.max(0,Math.floor((Date.now()-medSavedStart())/1000));
      medClearTimer();
      const mins=Math.max(1,Math.round(elapsed/60));
      const v=await openModal('记录本次冥想',[
        {key:'minutes',label:'时长（分钟）',type:'number',min:'1',value:mins,required:true},
        {key:'note',label:'感受备注（可选）',type:'textarea',placeholder:'此刻的状态、想法……'}
      ]);
      if(v){ S.meditation.push({id:uid(),date:today(),minutes:Number(v.minutes)||mins,note:(v.note||'').trim()}); save(); toast('冥想已记录'); }
      go('meditation');
      break;
    }
    case'med-cancel':{
      medClearTimer(); go('meditation'); break;
    }
    case'med-add':{
      const v=await openModal('手动补记冥想',[
        {key:'date',label:'日期',type:'date',value:today(),required:true},
        {key:'minutes',label:'时长（分钟）',type:'number',min:'1',value:10,required:true},
        {key:'note',label:'备注',type:'textarea'}
      ]);
      if(!v) return;
      S.meditation.push({id:uid(),date:v.date,minutes:Number(v.minutes)||0,note:(v.note||'').trim()}); save(); go(cur); toast('已补记');
      break;
    }
    case'med-del': delConfirm('这条冥想记录',()=>{S.meditation=S.meditation.filter(x=>x.id!==id);save();go(cur);}); break;

    /* 日记 / 习惯 */
    case'diary-tab': ui.diaryTab=b.dataset.v; go(cur); break;
    case'diary-prev': ui.diaryDate=addDays(ui.diaryDate,-1); ui.calYM=''; go(cur); break;
    case'diary-next': ui.diaryDate=addDays(ui.diaryDate,1); ui.calYM=''; go(cur); break;
    case'diary-today': ui.diaryDate=today(); ui.calYM=''; go(cur); break;
    /* 日记历史月历 */
    case'cal-prev': ui.calYM=shiftYM(ui.calYM||ui.diaryDate.slice(0,7),-1); go(cur); break;
    case'cal-next': ui.calYM=shiftYM(ui.calYM||ui.diaryDate.slice(0,7),1); go(cur); break;
    case'cal-pick': ui.diaryDate=b.dataset.d; ui.calYM=ui.diaryDate.slice(0,7); go(cur); break;
    case'mood-set':{
      const dd=ui.diaryDate;
      S.diary[dd]=Object.assign({},S.diary[dd],{mood:b.dataset.v}); save(); go(cur);
      break;
    }
    /* 5.1 日记配图 */
    case'photo-add': photoBox.click(); break;
    case'photo-del':{
      const pid=id, dd=ui.diaryDate;
      delConfirm('这张配图',async()=>{
        const en=S.diary[dd];
        if(en&&Array.isArray(en.photos)) en.photos=en.photos.filter(x=>x!==pid);
        await idbDel(pid).catch(()=>{});
        if(en&&!en.text&&!en.mood&&!(en.photos||[]).length) delete S.diary[dd];
        save(); go('diary'); toast('配图已删除');
      });
      break;
    }
    case'habit-add':{
      const inp=$('#habitName'); const name=inp.value.trim();
      if(!name){ toast('先输入习惯名称'); return; }
      S.habits.push({id:uid(),name,checks:[today()]}); save(); go(cur); toast('习惯已创建，今天已打卡');
      break;
    }
    case'habit-toggle':{
      const h=S.habits.find(x=>x.id===id);
      const i=h.checks.indexOf(d);
      if(i>=0) h.checks.splice(i,1); else h.checks.push(d);
      save(); go(cur);
      break;
    }
    case'habit-del': delConfirm('习惯「'+S.habits.find(x=>x.id===id).name+'」及其打卡记录',()=>{S.habits=S.habits.filter(x=>x.id!==id);save();go(cur);}); break;

    /* 4.1 习惯热力图月份翻页 */
    case'heat-prev': ui.habYM=shiftYM(ui.habYM||today().slice(0,7),-1); go(cur); break;
    case'heat-next': ui.habYM=shiftYM(ui.habYM||today().slice(0,7),1); go(cur); break;
    case'heat-today': ui.habYM=''; go(cur); break;

    /* 健身 */
    case'fit-tab': ui.fitTab=b.dataset.v; go(cur); break;
    case'log-add':{
      const v=await openModal('记录一次训练',[
        {key:'date',label:'日期',type:'date',value:today(),required:true},
        {key:'name',label:'训练内容',required:true,placeholder:'如：胸+三头 / 跑步 5 公里'}
      ]);
      if(!v) return;
      const lg={id:uid(),date:v.date,name:v.name.trim(),ex:[]};
      S.fitness.logs.push(lg); save();
      const ev=await openModal('添加动作（可跳过）',[
        {key:'name',label:'动作名称',placeholder:'如：杠铃卧推'},
        {key:'sets',label:'组数',type:'number',min:'1',value:4},
        {key:'reps',label:'每组次数',type:'number',min:'1',value:10},
        {key:'weight',label:'重量 kg（可选）',type:'number',min:'0',step:'0.5',placeholder:'无器械可留空'}
      ]);
      if(ev&&ev.name.trim()){ lg.ex.push({name:ev.name.trim(),sets:Number(ev.sets)||0,reps:Number(ev.reps)||0,weight:ev.weight||''}); save(); }
      ui.fitTab='log'; go(cur); toast('训练已记录');
      break;
    }
    case'logex-add':{
      const lg=S.fitness.logs.find(x=>x.id===id);
      const v=await openModal('给「'+lg.name+'」加动作',[
        {key:'name',label:'动作名称',required:true,placeholder:'如：深蹲'},
        {key:'sets',label:'组数',type:'number',min:'1',value:4},
        {key:'reps',label:'每组次数',type:'number',min:'1',value:10},
        {key:'weight',label:'重量 kg（可选）',type:'number',min:'0',step:'0.5'}
      ]);
      if(!v) return;
      lg.ex.push({name:v.name.trim(),sets:Number(v.sets)||0,reps:Number(v.reps)||0,weight:v.weight||''});
      save(); go(cur);
      break;
    }
    case'logex-del':{
      const lg=S.fitness.logs.find(x=>x.id===id);
      lg.ex.splice(Number(b.dataset.i),1); save(); go(cur); break;
    }
    case'log-copy':{
      const lg=S.fitness.logs.find(x=>x.id===id);
      if(!lg) break;
      S.fitness.logs.push({id:uid(),date:today(),name:lg.name,ex:(lg.ex||[]).map(e=>Object.assign({},e))});
      save(); go(cur); toast('已复制为今天的训练');
      break;
    }
    case'log-del': delConfirm('这次训练及其动作记录',()=>{S.fitness.logs=S.fitness.logs.filter(x=>x.id!==id);save();go(cur);}); break;
    case'weight-add':{
      const last=S.fitness.weight.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
      const v=await openModal('记录体重',[
        {key:'date',label:'日期',type:'date',value:today(),required:true},
        {key:'kg',label:'体重 kg',type:'number',min:'20',step:'0.1',value:last?last.kg:'',required:true}
      ]);
      if(!v) return;
      S.fitness.weight=S.fitness.weight.filter(x=>x.date!==v.date);
      S.fitness.weight.push({id:uid(),date:v.date,kg:Number(v.kg)}); save(); go(cur); toast('体重已记录');
      break;
    }
    case'weight-del':{
      if(!id) return;
      delConfirm('这条体重记录',()=>{S.fitness.weight=S.fitness.weight.filter(x=>x.id!==id);save();go(cur);});
      break;
    }

    /* 饮食 */
    case'diet-tab': ui.dietTab=b.dataset.v; go(cur); break;
    case'diet-prev': ui.dietDate=addDays(ui.dietDate,-1); go(cur); break;
    case'diet-next': ui.dietDate=addDays(ui.dietDate,1); go(cur); break;
    case'diet-today': ui.dietDate=today(); go(cur); break;
    case'food-add':{
      const name=$('#foodName').value.trim(), kcal=Number($('#foodKcal').value);
      if(!name){toast('请填写食物名称');return;}
      if(!(kcal>=0)){toast('请填写每份热量');return;}
      S.diet.foods.push({id:uid(),name,kcal}); save(); go(cur); toast('已加入食物库');
      break;
    }
    case'food-del': delConfirm('食物「'+S.diet.foods.find(x=>x.id===id).name+'」（不影响历史记录）',()=>{S.diet.foods=S.diet.foods.filter(x=>x.id!==id);save();go(cur);}); break;
    case'meal-add':{
      const dd=b.dataset.date;

        {key:'food',label:'食物',type:'select',options:opts,required:true},
        {key:'n',label:'份数',type:'number',min:'0.5',step:'0.5',value:1,required:true}

        form.querySelector('.foot').before(extra);
        root.querySelector('[data-key="food"]').addEventListener('change',e=>{
          extra.classList.toggle('d-none',e.target.value!=='__custom');
        });
      });
      if(!v) return;

      (S.diet.meals[dd]=S.diet.meals[dd]||[]).push({id:uid(),name,kcal,n:Number(v.n)||1,mealType:MEAL_TYPES.includes(v.mealType)?v.mealType:defaultMealType()});

    }
    case'game-del': delConfirm('游戏「'+S.games.list.find(x=>x.id===id).name+'」（历史娱乐时长会保留）',()=>{
      S.games.list=S.games.list.filter(x=>x.id!==id); save(); go(cur);
    }); break;
    case'sess-add':{
      const v=await openModal('记录娱乐时长',[
        {key:'gid',label:'游戏',type:'select',options:S.games.list.map(g=>[g.id,g.name+(g.status==='playing'?'（在玩）':'')]),required:true},
        {key:'date',label:'日期',type:'date',value:today(),required:true},

    }
    case'sess-del': delConfirm('这条时长记录',()=>{S.games.sessions=S.games.sessions.filter(x=>x.id!==id);save();go(cur);}); break;

    case'notif-enable':{

      }catch(_){ toast('授权失败，仍会在首页提示备份'); }
      break;
    }
    case'export-data':{
      const imgs=await idbExportAll();
      const payload=JSON.parse(JSON.stringify(S));
      if(Object.keys(imgs).length) payload._images=imgs;
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const a=document.createElement('a');

      go(cur);
      break;
    }
    case'backup-snooze': S.meta.snoozeDate=today(); save(); go(cur); break;
    /* 5.4 各模块 CSV 导出，data-act="csv-<kind>" */
    case'csv-tasks':case'csv-diet':case'csv-water':case'csv-games':
    case'csv-fitlog':case'csv-weight':case'csv-meditation':case'csv-diary':case'csv-habits':
      exportCSV(a.slice(4)); break;
    case'import-data': importBox.click(); break;

      if(!confirm('确定清空全部数据吗？此操作不可恢复，建议先导出备份。')) return;

      break;
    }
  }

/* 文件导入：启动时动态创建隐藏文件选择器（避免依赖视图内元素） */
const importBox=document.createElement('input');
importBox.type='file'; importBox.accept='.json,application/json';
importBox.style.display='none'; document.body.appendChild(importBox);
importBox.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>IMPORT_SIZE_LIMIT){ toast('备份文件过大（超过 50MB），导入取消'); e.target.value=''; return; }
  const reader=new FileReader();
  reader.onload=async()=>{
    let data;
    try{ data=parseBackup(reader.result); }
    catch(err){ toast('导入失败：'+err.message); e.target.value=''; return; }
    if(!confirm('导入将覆盖当前全部数据，确定继续吗？')){ e.target.value=''; return; }
    /* 还原 IndexedDB 图片（备份中的 _images 为 dataURL 映射） */
    const imgs=data._images||{};
    delete data._images;
    let bad=0;
    await idbClear();
    await Promise.all(Object.keys(imgs).map(async pid=>{
      try{ await idbPut(pid,dataURLtoBlob(imgs[pid])); }catch(_){ bad++; }
    }));
    S=data; save(); applyTheme(); go('home');
    toast(bad?('备份已导入，'+bad+' 张图片恢复失败'):'备份已导入');
    e.target.value='';
  };
  reader.onerror=()=>{ toast('文件读取失败，导入取消'); e.target.value=''; };
  reader.readAsText(file);
});

/* 5.1 日记配图选择器（必须在 importBox 之后创建，保持第一个 file input 为备份导入框） */
const photoBox=document.createElement('input');
photoBox.type='file'; photoBox.accept='image/*'; photoBox.multiple=true;
photoBox.style.display='none'; document.body.appendChild(photoBox);
photoBox.addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);
  e.target.value='';
  if(!files.length) return;
  const d=ui.diaryDate;
  const existed=!!S.diary[d];
  /* 先把文本框中尚未防抖落盘的内容同步进去 */
  const ta0=$('#diaryText');
  if(ta0){ if(!S.diary[d]) S.diary[d]={text:'',mood:'',photos:[]}; S.diary[d].text=ta0.value; }
  let added=0, skipped=0;
  for(const f of files){
    if(!/^image\//.test(f.type)){ skipped++; continue; }
    if(f.size>PHOTO_SIZE_LIMIT){ skipped++; continue; }
    const pid=uid();
    try{ await idbPut(pid,f); }catch(err){ skipped++; continue; }
    if(!S.diary[d]) S.diary[d]={text:'',mood:'',photos:[]};
    if(!Array.isArray(S.diary[d].photos)) S.diary[d].photos=[];
    S.diary[d].photos.push(pid); added++;
  }
  /* 一张都没添加且条目原本不存在：回滚刚才为同步文本创建的空条目 */
  if(!added&&!existed&&S.diary[d]&&!S.diary[d].text&&!S.diary[d].mood&&!(S.diary[d].photos||[]).length) delete S.diary[d];
  save(); go('diary');
  if(added) toast('已添加 '+added+' 张图片');
  if(skipped) toast(skipped+' 张图片被跳过（非图片或超过 8MB）');
});

/* ---------- 5.4 各模块 CSV 导出 ---------- */
/* 单元格转义：含逗号/引号/换行时用双引号包裹，内部引号翻倍（RFC 4180） */
function csvCell(v){
  v=(v===null||v===undefined)?'':String(v);
  return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function toCSV(headers,rows){
  return String.fromCharCode(0xFEFF)+[headers].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');
}
function downloadText(filename,text,mime){
  const blob=new Blob([text],{type:(mime||'text/csv')+';charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
/* 汇总各模块为 {文件名,表头,行数据}；纯函数便于测试 */
function csvBuild(kind){
  switch(kind){
    case'tasks':{
      const dates=Object.keys(S.tasks).sort();
      return {name:'今日计划',headers:['日期','内容','计划时间','优先级','备注','状态'],
        rows:dates.flatMap(d=>S.tasks[d].map(t=>[d,t.text,t.time||'',t.pri||'',t.note||'',t.done?'已完成':'未完成']))};
    }
    case'diet':{
      const dates=Object.keys(S.diet.meals).sort();
      return {name:'饮食记录',headers:['日期','餐次','食物','份数','热量(千卡)'],
        rows:dates.flatMap(d=>S.diet.meals[d].map(m=>[d,m.mealType||'',m.name,m.n||1,m.kcal]))};
    }
    case'water':{
      const dates=Object.keys(S.diet.water).filter(d=>S.diet.water[d]>0).sort();
      return {name:'饮水记录',headers:['日期','杯数'],rows:dates.map(d=>[d,S.diet.water[d]])};
    }
    case'games':{
      const name=gid=>(S.games.list.find(g=>g.id===gid)||{}).name||'（已删除的游戏）';
      return {name:'娱乐时长',headers:['日期','游戏','时长(分钟)'],
        rows:S.games.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,name(x.gid),x.minutes])};
    }
    case'fitlog':{
      const rows=[];
      S.fitness.logs.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(lg=>{
        if(lg.ex&&lg.ex.length) lg.ex.forEach(ex=>rows.push([lg.date,lg.name,ex.name,ex.sets,ex.reps,ex.weight||'']));
        else rows.push([lg.date,lg.name,'','','','']);
      });
      return {name:'健身训练',headers:['日期','训练名','动作','组数','次数','重量(kg)'],rows};
    }
    case'weight':{
      return {name:'体重记录',headers:['日期','体重(kg)'],
        rows:S.fitness.weight.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.kg])};
    }
    case'meditation':{
      return {name:'冥想记录',headers:['日期','时长(分钟)','备注'],
        rows:S.meditation.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.minutes,x.note||''])};
    }
    case'diary':{
      const dates=Object.keys(S.diary).sort();
      return {name:'日记',headers:['日期','心情','文字','配图数'],
        rows:dates.map(d=>{ const x=S.diary[d]||{}; return [d,x.mood||'',x.text||'',(x.photos||[]).length]; })};
    }
    case'habits':{
      return {name:'习惯打卡',headers:['习惯','累计打卡天数','当前连续天数'],
        rows:S.habits.map(h=>[h.name,(h.checks||[]).length,habitStreak(h)])};
    }
    default: throw new Error('未知的 CSV 模块：'+kind);
  }
}
function exportCSV(kind){
  const spec=csvBuild(kind);
  downloadText('生活助手-'+spec.name+'-'+today()+'.csv',toCSV(spec.headers,spec.rows));
  toast(spec.name+' CSV 已导出 （'+spec.rows.length+' 条）');
}

<!-- ==== VISUAL LAYER (build/cdp: exactly one copy) ==== -->
<!-- ================================================================
     视觉增强层 / Visual enhancement layer  (v3 Deep Space)
     ----------------------------------------------------------------
     本层是纯增量：不读取、不修改任何应用状态，只做三件事
       1. 注入大气层背景与跟手光斑（装饰，pointer-events:none）
       2. 把视图内新渲染的内容编排入场（IntersectionObserver）
       3. 给卡片与按钮接上鼠标交互（3D 倾斜 / 跟随高光 / 磁吸）
     所有动效只动 transform 与 opacity；prefers-reduced-motion 下全部跳过。
     ================================================================ -->
<script>
(function(){
  'use strict';
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  var reduced = !!(RM && RM.matches);
  var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---------- 1. 大气层 ---------- */
  function addAtmos(){
    if (document.querySelector('.atmos')) return;
    var d = document.createElement('div');
    d.className = 'atmos';
    d.setAttribute('aria-hidden', 'true');
    var g = document.createElement('div');
    g.className = 'grid-veil';
    d.appendChild(g);
    document.body.insertBefore(d, document.body.firstChild);
  }

  /* ---------- 2. 跟手光斑（指针插值跟随，rAF 驱动） ---------- */
  var glow = null, gx = 0, gy = 0, tx = 0, ty = 0, glowOn = false, rafId = 0;
  function addGlow(){
    if (glow || reduced || !fine) return;
    glow = document.createElement('div');
    glow.id = 'cursorGlow';
    glow.setAttribute('aria-hidden', 'true');
    document.body.appendChild(glow);
    window.addEventListener('pointermove', function(e){
      tx = e.clientX; ty = e.clientY;
      if (!glowOn){ glowOn = true; glow.classList.add('on'); gx = tx; gy = ty; }
      if (!rafId) rafId = requestAnimationFrame(tick);
    }, { passive: true });
    document.addEventListener('pointerleave', function(){
      glowOn = false; if (glow) glow.classList.remove('on');
    });
  }
  function tick(){
    rafId = 0;
    gx += (tx - gx) * 0.14;
    gy += (ty - gy) * 0.14;
    if (glow) glow.style.transform = 'translate3d(' + gx.toFixed(1) + 'px,' + gy.toFixed(1) + 'px,0)';
    if (Math.abs(tx - gx) > 0.5 || Math.abs(ty - gy) > 0.5) rafId = requestAnimationFrame(tick);
  }

  /* ---------- 3. 滚动进度 ---------- */
  function addBar(){
    if (reduced || document.getElementById('scrollBar')) return;
    var b = document.createElement('div');
    b.id = 'scrollBar';
    b.setAttribute('aria-hidden', 'true');
    document.body.appendChild(b);
    var ticking = false;
    function upd(){
      ticking = false;
      var de = document.documentElement;
      var max = de.scrollHeight - de.clientHeight;
      var p = max > 0 ? Math.min(1, de.scrollTop / max) : 0;
      b.style.transform = 'scaleX(' + p.toFixed(4) + ')';
    }
    window.addEventListener('scroll', function(){
      if (!ticking){ ticking = true; requestAnimationFrame(upd); }
    }, { passive: true });
    upd();
  }

  /* ---------- 4. 入场编排 ---------- */
  var io = null;
  function armReveal(root){
    if (reduced || !io) return;
    var nodes = root.querySelectorAll('.card, .dcalbox, .cc-card, .pcard, .col, .warnbox, .okbox, .bw, .heatgrid, .dcalgrid');
    for (var i = 0; i < nodes.length; i++){
      var el = nodes[i];
      if (el.hasAttribute('data-reveal') || el.classList.contains('is-in')) continue;
      // 同组内按顺序错开 60–88ms，最多累计 8 档，避免长列表尾部等待过久
      el.style.setProperty('--rd', Math.min(i, 7) * 70 + 'ms');
      el.setAttribute('data-reveal', '');
      io.observe(el);
    }
  }
  function initReveal(){
    if (reduced || !('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(function(entries){
      for (var i = 0; i < entries.length; i++){
        var en = entries[i];
        if (!en.isIntersecting) continue;
        en.target.classList.add('is-in');
        io.unobserve(en.target);
      }
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    var view = document.getElementById('view');
    if (view){
      armReveal(view);
      // 视图整体重渲染后重新编排
      new MutationObserver(function(){ armReveal(view); }).observe(view, { childList: true });
    }
    armReveal(document);
  }

  /* ---------- 5. 卡片 3D 倾斜 + 跟随高光 ---------- */
  function initTilt(){
    if (reduced || !fine) return;
    var MAX = 5.5;
    document.addEventListener('pointermove', function(e){
      var el = e.target && e.target.closest ? e.target.closest('.cc-card') : null;
      if (!el){
        var prev = document.querySelectorAll('.cc-card[data-tilt]');
        for (var k = 0; k < prev.length; k++){
          prev[k].removeAttribute('data-tilt');
          prev[k].style.setProperty('--rx', '0deg');
          prev[k].style.setProperty('--ry', '0deg');
          prev[k].style.setProperty('--ty', '0px');
        }
        return;
      }
      var r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var px = (e.clientX - r.left) / r.width;
      var py = (e.clientY - r.top) / r.height;
      el.setAttribute('data-tilt', '');
      el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
      el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      el.style.setProperty('--ry', ((px - 0.5) * MAX * 2).toFixed(2) + 'deg');
      el.style.setProperty('--rx', ((0.5 - py) * MAX * 2).toFixed(2) + 'deg');
      el.style.setProperty('--ty', '-3px');
    }, { passive: true });
  }

  /* ---------- 6. 按钮磁吸 ---------- */
  function initMagnet(){
    if (reduced || !fine) return;
    var PULL = 0.28, RANGE = 72;
    document.addEventListener('pointermove', function(e){
      var btns = document.querySelectorAll('#view .btn');
      for (var i = 0; i < btns.length; i++){
        var b = btns[i];
        if (b.disabled) continue;
        var r = b.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var dx = e.clientX - cx, dy = e.clientY - cy;
        var near = Math.abs(dx) < r.width / 2 + RANGE && Math.abs(dy) < r.height / 2 + RANGE;
        if (near){
          var f = 1 - Math.min(1, Math.max(Math.abs(dx) / (r.width / 2 + RANGE), Math.abs(dy) / (r.height / 2 + RANGE)));
          b.style.transform = 'translate3d(' + (dx * PULL * f).toFixed(1) + 'px,' + (dy * PULL * f).toFixed(1) + 'px,0)';
        } else if (b.style.transform){
          b.style.transform = '';
        }
      }
    }, { passive: true });
  }

  /* ---------- 7. 图标：刻意不改 DOM ----------
     这里曾把 emoji 换成内联 SVG。已移除，原因是它改写了 textContent，
     而应用自带的测试套件会断言视图文本（例如 /🍽 午餐/），
     纯视觉层不应该改变 DOM 的文本契约。
     想要单色图标，应当在应用的渲染函数里改，而不是在这里重写文本节点。
     emoji 的外观由 .cc-name / .card h3 的 CSS 降噪处理。 */

  /* ---------- 8. 首页卡片堆叠：后一张盖上来的过程中，前一张逐渐缩小 ---------- */
  function initStack(){
    if (reduced) return;
    var items = document.querySelectorAll('.cc-stack-item');
    if (!items.length) return;

    function upd(){
      var vh = window.innerHeight;
      for (var i = 0; i < items.length; i++){
        var el = items[i];
        var next = items[i + 1];
        // 下一张卡从视口底部上升到它自己的粘性位置，就是"覆盖进度"
        var nextTop = next ? next.getBoundingClientRect().top : vh;
        var stickTop = next ? (parseFloat(next.style.top) || 110) : 110;
        var span = vh - stickTop;
        var p = span > 0 ? Math.min(1, Math.max(0, (vh - nextTop) / span)) : 0;
        var scale = 1 - p * 0.055;
        el.style.transform = 'scale(' + scale.toFixed(3) + ')';
        el.style.opacity = (1 - p * 0.35).toFixed(3);
      }
    }

    var ticking = false;
    window.addEventListener('scroll', function(){
      if (!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; upd(); }); }
    }, { passive: true });
    window.addEventListener('resize', upd, { passive: true });
    upd();
  }

  /* ---------- 9. 导语：滚动驱动的文字揭示（遮罩，文本只有一份） ---------- */
  function initMaskReveal(){
    if (reduced) return;
    var els = document.querySelectorAll('[data-mask-reveal]');
    if (!els.length) return;

    function upd(){
      var vh = window.innerHeight;
      for (var i = 0; i < els.length; i++){
        var r = els[i].getBoundingClientRect();
        var start = vh * 0.88, end = vh * 0.38;
        var p = Math.min(1, Math.max(0, (start - r.top) / (start - end)));
        var head = (p * 100).toFixed(1);
        var tail = Math.min(100, p * 100 + 16).toFixed(1);
        var m = 'linear-gradient(100deg,rgba(0,0,0,1) 0%,rgba(0,0,0,1) ' + head +
                '%,rgba(0,0,0,.14) ' + tail + '%,rgba(0,0,0,.14) 100%)';
        els[i].style.maskImage = m;
        els[i].style.webkitMaskImage = m;
      }
    }

    var ticking = false;
    window.addEventListener('scroll', function(){
      if (!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; upd(); }); }
    }, { passive: true });
    upd();
  }

  /* ---------- 10. 首页两个内联输入：回车即提交 ---------- */
  function initQuickAdd(){
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      var el = e.target;
      if (!el || !el.id) return;
      if (el.id !== 'homeQuickAdd' && el.id !== 'calQuickAdd') return;
      e.preventDefault();
      var wrap = el.parentNode;
      var btn = wrap && wrap.querySelector('[data-act]');
      if (btn) btn.click();
    });
  }

  /* ---------- 启动 ---------- */
  function boot(){
    addAtmos();
    addGlow();
    addBar();
    initReveal();
    initTilt();
    initMagnet();
    initStack();
    initMaskReveal();
    initQuickAdd();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
/* ================================================================
   首屏伙伴：用真实照片做立体交互（v2，替换原 Canvas 手绘脸）
   ----------------------------------------------------------------
   为什么换成照片：手绘 Canvas 卡通脸达不到"高级感"的门槛。
   照片 + 透视变换 + 跟随光照，能产生真实的体积感，而且就是本人。

   手法（原生，零依赖）：
     1. 头部绕 Y/X 轴微转（±6°），透视深度 900px
     2. 跟随光斑：径向高光随指针移动，模拟光源方向变化
     3. 照片边缘径向遮罩淡出，融入深色页面而不是贴一块方块
     4. 靠近时轻微推近；转离指针的一侧压暗，强化体积感

   素材：assets/portrait-1x.jpg / portrait-2x.jpg
   性能：静止时停掉 rAF；reduced-motion 与触屏下只显示静态照片。
   ================================================================ */
(function () {
  'use strict';

  var ID = 'heroBuddy';
  var MAX_ROT = 6;        // 最大旋转角（度）
  var MAX_PUSH = 1.035;   // 靠近时最大放大

  var host = null, frame = null, inner = null, glare = null;
  var tx = 0, ty = 0, nx = 0, ny = 0, near = 0;
  var rafId = 0;

  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var coarse = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
  var animated = !reduced && !coarse;

  function build() {
    var hd = document.querySelector('.cc-hd');
    if (!hd) return false;
    if (hd.querySelector('#' + ID)) return true;

    host = document.createElement('div');
    host.id = ID;
    host.setAttribute('aria-hidden', 'true');
    host.innerHTML =
      '<div class="hb-frame">' +
        '<div class="hb-inner">' +
          '<img class="hb-photo" alt="" draggable="false"' +
               ' src="assets/portrait-1x.jpg"' +
               ' srcset="assets/portrait-1x.jpg 420w, assets/portrait-2x.jpg 760w"' +
               ' sizes="(max-width: 860px) 176px, 320px">' +
          '<span class="hb-glare"></span>' +
        '</div>' +
      '</div>';

    hd.appendChild(host);
    frame = host.querySelector('.hb-frame');
    inner = host.querySelector('.hb-inner');
    glare = host.querySelector('.hb-glare');
    return true;
  }

  function aim(cx, cy) {
    if (!host) return;
    var r = host.getBoundingClientRect();
    if (!r.width) return;
    var mx = r.left + r.width / 2, my = r.top + r.height / 2;

    tx = Math.max(-1, Math.min(1, (cx - mx) / (window.innerWidth * 0.5)));
    ty = Math.max(-1, Math.min(1, (cy - my) / (window.innerHeight * 0.5)));

    var dist = Math.sqrt((cx - mx) * (cx - mx) + (cy - my) * (cy - my));
    near += ((dist < r.width * 1.4 ? 1 : 0) - near) * 0.08;
    wake();
  }

  function render() {
    if (!inner) return;

    nx += (tx - nx) * 0.10;
    ny += (ty - ny) * 0.10;

    var ry = nx * MAX_ROT;              // 指针在右 → 向右转
    var rx = -ny * MAX_ROT * 0.7;
    var push = 1 + (MAX_PUSH - 1) * near;

    inner.style.transform =
      'perspective(900px) rotateY(' + ry.toFixed(2) + 'deg) rotateX(' + rx.toFixed(2) +
      'deg) scale(' + push.toFixed(3) + ')';

    if (glare) {
      var gx = (50 + nx * 30).toFixed(1);
      var gy = (50 + ny * 30).toFixed(1);
      glare.style.background =
        'radial-gradient(circle at ' + gx + '% ' + gy + '%,' +
        'rgba(255,255,255,' + (0.10 + near * 0.10).toFixed(3) + ') 0%,' +
        'rgba(255,255,255,' + (0.03 + near * 0.04).toFixed(3) + ') 32%,' +
        'rgba(255,255,255,0) 62%)';
    }
    if (frame) {
      frame.style.boxShadow =
        (nx * 10).toFixed(1) + 'px ' + (ny * 8).toFixed(1) + 'px 40px rgba(0,0,0,.55)';
    }
  }

  function wake() {
    if (!animated || rafId || !inner) return;
    rafId = requestAnimationFrame(function loop() {
      rafId = 0;
      render();
      if (Math.abs(tx - nx) > 0.0015 || Math.abs(ty - ny) > 0.0015) wake();
    });
  }

  function onMove(e) { aim(e.clientX, e.clientY); }

  function start() {
    if (!animated) return;
    window.addEventListener('pointermove', onMove, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
      else wake();
    });
  }

  /* 视图切换后重建 / 离开首页时清理 */
  function ensure() {
    var view = document.getElementById('view');
    if (!view) return;
    if (view.querySelector('.cc-hd')) {
      var fresh = !host;
      if (build()) {
        if (fresh) start();
        wake();
      }
    } else if (host && host.parentNode) {
      host.parentNode.removeChild(host);
      host = null; frame = null; inner = null; glare = null;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    }
  }

  function begin() {
    ensure();
    var v = document.getElementById('view');
    if (v) new MutationObserver(ensure).observe(v, { childList: true, subtree: false });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', begin);
  else begin();
})();
</script>

</body>
