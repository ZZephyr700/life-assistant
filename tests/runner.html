<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生活助手 - 自动化测试</title>
<style>
  body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;margin:0;background:#f4f5f8;color:#1f2329}
  #bar{position:sticky;top:0;background:#1d2027;color:#fff;padding:14px 24px;font-size:15px;z-index:9;display:flex;gap:20px;align-items:center}
  #bar b{font-size:18px}
  #results{padding:20px 24px 80px;max-width:900px}
  .grp{background:#fff;border:1px solid #e8eaef;border-radius:12px;margin-bottom:14px;overflow:hidden}
  .grp h3{margin:0;padding:12px 16px;font-size:14px;background:#fafbff;border-bottom:1px solid #e8eaef}
  .t{padding:9px 16px;border-top:1px solid #f0f1f5;font-size:13px;display:flex;gap:10px;align-items:flex-start}
  .t:first-of-type{border-top:none}
  .tag{font-weight:700;width:46px;flex-shrink:0}
  .pass .tag{color:#2fb36e}.fail .tag{color:#e5484d}
  .fail .msg{color:#e5484d;white-space:pre-wrap;margin-top:3px;font-size:12.5px}
  #app{display:block;width:100%;height:520px;border:2px solid #ccc;opacity:1;background:#fff;margin-bottom:30px}
</style>
</head>
<body>
<div id="bar"><span>🧪 生活助手自动化测试</span><b id="runstate">运行中…</b><span id="counts"></span></div>
<iframe id="app" title="app"></iframe>
<div id="results"></div>
<script>
/* ================= 测试框架 ================= */
const frame=document.getElementById('app');
const results=document.getElementById('results');
let W,D;
let passed=0,failed=0;

/* 真实墙钟等待：仅防抖/计时器等确需真实时间的测试使用（失焦窗口下定时器约 1s 粒度） */
const rsleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 宏任务滴答：后台/失焦窗口中 setTimeout 会被节流到约 1s，
   MessageChannel 宏任务不被节流，用它让出事件循环以推进渲染/IDB/事件回调 */
function mtick(n){ return new Promise(res=>{ const ch=new MessageChannel(); let i=0; ch.port1.onmessage=()=>{ if(++i>=n){ch.port1.onmessage=null;res();} else ch.port2.postMessage(0); }; ch.port2.postMessage(0); }); }
/* settle 等待：按等待时长折算成少量宏任务滴答（不再依赖被节流的定时器） */
const sleep=ms=>mtick(Math.max(4,Math.ceil((ms||0)/12)));
function assert(c,m){ if(!c) throw new Error(m||'断言失败'); }
function eq(a,b,m){ if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error((m||'相等断言失败')+'\n期望: '+JSON.stringify(b)+'\n实际: '+JSON.stringify(a)); }
async function waitFor(fn,t=5000){ const t0=Date.now(); while(Date.now()-t0<t){ try{ const r=await fn(); if(r) return r; }catch(e){} await mtick(4);} throw new Error('等待超时'); }

async function bootApp(){
  await new Promise(res=>{ frame.onload=res; frame.src='/index.html?test=1&r='+Date.now(); });
  await waitFor(()=>frame.contentWindow.__app&&frame.contentWindow.__app.view&&frame.contentWindow.__app.view.children.length);
  W=frame.contentWindow; D=frame.contentDocument;
  W.confirm=()=>true; W.alert=()=>true;
  // createObjectURL 同时被导出 JSON 和日记缩略图（PNG）使用，按 MIME 精确取备份 blob
  const blobs=[];
  W.URL.createObjectURL=blob=>{ blobs.push(blob); return 'blob:mock/'+Math.random(); };
  W.URL.revokeObjectURL=()=>{};
  bootApp.lastBlobText=async()=>await new Promise((res,rej)=>{ const b=blobs.slice().reverse().find(x=>x.type==='application/json')||blobs[blobs.length-1]; const r=new W.FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(b); });
  bootApp.lastBlobOfType=async(mime)=>await new Promise((res,rej)=>{ const b=blobs.slice().reverse().find(x=>(x.type||'').indexOf(mime)===0); if(!b){rej(new Error('没有 '+mime+' 类型的 blob'));return;} const r=new W.FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(b); });
}
async function reset(){ await W.__app.reset(); await sleep(50); }
async function go(v){ W.__app.go(v); await sleep(55); }
function q(sel){ return D.querySelector(sel); }
function qa(sel){ return Array.from(D.querySelectorAll(sel)); }
function clickAct(act,idx){ const els=qa('[data-act="'+act+'"]'); const el=els[idx||0]; assert(el,'找不到按钮 data-act='+act+'(idx '+(idx||0)+')'); el.click(); return el; }
async function waitModal(){ await waitFor(()=>D.querySelector('.mask')); }
async function fillModal(map){
  await waitModal();
  for(const k of Object.keys(map)){
    const el=D.querySelector('.mask [data-key="'+k+'"]');
    assert(el,'弹窗中找不到字段 '+k);
    el.value=map[k];
    el.dispatchEvent(new W.Event('input',{bubbles:true}));
    el.dispatchEvent(new W.Event('change',{bubbles:true}));
  }
}
async function okModal(){ D.querySelector('#mok').click(); await sleep(90); }
async function cancelModal(){ D.querySelector('#mcancel').click(); await sleep(50); }
function toastText(){ return D.querySelector('#toast').textContent; }
function viewText(){ return W.__app.view.textContent; }
function tplText(){ const m=D.querySelector('#tplMask'); return m?m.textContent:''; }

/* ================= 分组注册与执行 ================= */
const groups=[];
function group(name,tests){ groups.push({name,tests}); }

async function run(){
  await bootApp();
  const m=/[?&]grp=([^&]+)/.exec(location.search);
  const grpFilter=m?decodeURIComponent(m[1]):'';
  const runGroups=grpFilter?groups.filter(g=>g.name.indexOf(grpFilter)>=0):groups;
  for(const g of runGroups){
    const box=document.createElement('div'); box.className='grp';
    box.innerHTML='<h3>'+g.name+'</h3>'; results.appendChild(box);
    for(const [name,fn] of g.tests){
      const row=document.createElement('div'); row.className='t';
      try{ await fn(); passed++; row.classList.add('pass'); row.innerHTML='<span class="tag">PASS</span><span>'+name+'</span>'; }
      catch(e){ failed++; row.classList.add('fail'); row.innerHTML='<span class="tag">FAIL</span><div><div>'+name+'</div><div class="msg">'+String(e.message||e).replace(/</g,'&lt;')+'</div></div>'; }
      box.appendChild(row);
      document.getElementById('counts').textContent='通过 '+passed+' / 失败 '+failed;
      await sleep(10);
    }
  }
  document.getElementById('runstate').textContent= failed? ('完成：'+failed+' 个失败') : '全部通过 ✅';
  document.getElementById('runstate').style.color= failed?'#ff8085':'#7ff0b0';
  document.title='TESTS '+(failed?('FAIL '+failed):'ALL PASS')+' ('+(passed+failed)+')';
  window.__summary={passed,failed,done:true};
  document.body.dataset.done='1';
}

/* ================================================================
   阶段二：健壮性与体验优化
================================================================ */
group('阶段二 2.1 数据版本迁移与加载',[
  ['migrate 接受当前版本数据并保持版本号',async()=>{
    const s=W.__app.defaultState();
    const m=W.__app.migrate(JSON.parse(JSON.stringify(s)));
    eq(m.v,2,'默认数据版本应为 2');
    assert(Array.isArray(m.taskTemplates),'应含任务模板库字段');
  }],
  ['migrate 拒绝缺少版本号的数据',async()=>{
    let e=''; try{ W.__app.migrate({settings:{}}); }catch(x){e=x.message;}
    assert(/版本号/.test(e),'应提示缺少版本号，实际：'+e);
  }],
  ['migrate 拒绝更新版本的备份',async()=>{
    let e=''; try{ W.__app.migrate({v:99}); }catch(x){e=x.message;}
    assert(/更新/.test(e),'应提示版本更新，实际：'+e);
  }],
  ['migrate 拒绝 null 和 v=0',async()=>{
    assert(()=>{try{W.__app.migrate(null);return false;}catch(e){return true;}});
    let e=''; try{ W.__app.migrate({v:0}); }catch(x){e=x.message;}
    assert(/不受支持/.test(e),'实际：'+e);
  }],
  ['parseBackup 拒绝空字符串、非 JSON、结构残缺',async()=>{
    const bads=['','   ','not json','{"v":1}','{"v":1,"settings":{}}'];
    for(const t of bads){ let e=''; try{ W.__app.parseBackup(t); }catch(x){e=x.message;} assert(e,'应拒绝：'+JSON.stringify(t)); }
  }],
  ['parseBackup 接受完整备份',async()=>{
    const s=W.__app.defaultState(); s.quickNotes=[{id:'a',text:'x'}];
    const m=W.__app.parseBackup(JSON.stringify(s));
    eq(m.quickNotes.length,1,'应解析出备忘');
  }],
  ['本地存储损坏时自动回退初始数据且能启动',async()=>{
    W.localStorage.setItem('lifeapp_v1','{这不是合法JSON');
    await bootApp();
    assert(W.__app.view.children.length>0,'首页应正常渲染');
    assert(/已完成/.test(viewText()),'首页摘要应存在');
    await reset();
  }]
]);

group('阶段二 2.2 弹窗键盘交互',[
  ['任务弹窗按 Escape 关闭且不产生数据',async()=>{
    await reset(); await go('plan');
    clickAct('task-add'); await waitModal();
    D.dispatchEvent(new W.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    await sleep(60);
    assert(!D.querySelector('.mask'),'弹窗应已关闭');
    eq(W.__app.state.tasks[W.__app.today()]||[], [], '不应产生任务');
  }],
  ['弹窗表单提交（回车等价路径）创建任务',async()=>{
    await go('plan');
    clickAct('task-add'); await waitModal();
    await fillModal({text:'键盘创建的任务',pri:'高'});
    D.querySelector('#mform').requestSubmit();
    await sleep(80);
    assert(!D.querySelector('.mask'),'提交后弹窗应关闭');
    const list=W.__app.tasksOf(W.__app.today());
    eq(list.length,1,'应有 1 条任务');
    eq(list[0].text,'键盘创建的任务'); eq(list[0].pri,'高');
  }],
  ['必填项为空时阻止提交并提示',async()=>{
    clickAct('task-add'); await waitModal();
    await fillModal({text:'   '});
    D.querySelector('#mform').requestSubmit();
    await sleep(60);
    assert(D.querySelector('.mask'),'弹窗应保留');
    assert(/请填写/.test(toastText()),'应提示必填，实际：'+toastText());
    D.querySelector('#mcancel').click(); await sleep(40);
  }],
  ['点遮罩空白处关闭弹窗',async()=>{
    clickAct('task-add'); await waitModal();
    D.querySelector('.mask').dispatchEvent(new W.MouseEvent('click',{bubbles:true}));
    await sleep(50);
    assert(!D.querySelector('.mask'),'弹窗应关闭');
  }]
]);

group('阶段二 2.3 空状态与异常边界',[
  ['初始空数据下 9 个视图均无 NaN/undefined',async()=>{
    await reset();
    const bad=/NaN|undefined|Invalid Date|null/;
    const routes=['home','plan','media','meditation','diary','fitness','diet','games','settings'];
    for(const r of routes){ await go(r); assert(!bad.test(viewText()), r+' 出现异常文本'); }
  }],
  ['各模块二级标签页空状态正常',async()=>{
    const steps=[
      ['media',()=>{W.__app.ui.mediaTab='ideas';}],['meditation',()=>{}],
      ['diary',()=>{W.__app.ui.diaryTab='habits';}],
      ['fitness',()=>{W.__app.ui.fitTab='log';}],['fitness',()=>{W.__app.ui.fitTab='weight';}],
      ['diet',()=>{W.__app.ui.dietTab='foods';}],['games',()=>{W.__app.ui.gameTab='sessions';}]
    ];
    for(const [r,prep] of steps){ prep(); await go(r); assert(!/NaN|undefined|Invalid Date/.test(viewText()), r+' 空状态异常'); }
  }],
  ['删除最后一个习惯后首页与习惯页正常',async()=>{
    await reset();
    W.__app.state.habits.push({id:'h1',name:'测试习惯',checks:[W.__app.today()]}); W.__app.save();
    await go('home'); assert(/1\/1/.test(viewText()),'应显示 1/1');
    W.__app.ui.diaryTab='habits'; await go('diary');
    clickAct('habit-del'); await sleep(50);
    eq(W.__app.state.habits.length,0);
    await go('home'); assert(!/NaN|undefined/.test(viewText()));
    W.__app.ui.diaryTab='habits'; await go('diary');
    assert(/还没有习惯/.test(viewText()),'应显示习惯空状态');
  }],
  ['删除最后一个食物后食物库显示空状态',async()=>{
    await reset();
    W.__app.state.diet.foods=[]; W.__app.save();
    W.__app.ui.dietTab='foods'; await go('diet');
    assert(/食物库是空的/.test(viewText()));
    assert(!/NaN|undefined/.test(viewText()));
  }],
  ['删除游戏后其历史时长记录显示占位而非报错',async()=>{
    await reset();
    const st=W.__app.state;
    st.games.list.push({id:'g1',name:'某游戏',status:'done',rating:0,note:''});
    st.games.sessions.push({id:'s1',gid:'g1',date:W.__app.today(),minutes:30});
    W.__app.save();
    W.__app.ui.gameTab='list';
    await go('games');
    qa('[data-act="game-del"]')[0].click(); await sleep(50);
    W.__app.ui.gameTab='sessions'; await go('games');
    assert(/已删除的游戏/.test(viewText()),'应显示已删除占位');
    assert(!/NaN|undefined/.test(viewText()));
  }],
  ['清空数据后预置食物恢复为 8 种',async()=>{
    const st=W.__app.state; st.quickNotes.push({id:'x',text:'y',t:1,d:W.__app.today()}); W.__app.save();
    await W.__app.reset(); await sleep(20);
    eq(W.__app.state.diet.foods.length,8);
    eq(W.__app.state.quickNotes.length,0);
  }]
]);

group('阶段二 2.4 日期边界',[
  ['跨年加减日期',async()=>{
    const A=W.__app;
    eq(A.addDays('2024-12-31',1),'2025-01-01');
    eq(A.addDays('2025-01-01',-1),'2024-12-31');
    eq(A.addDays('2025-12-31',1),'2026-01-01');
  }],
  ['闰年 2 月',async()=>{
    const A=W.__app;
    eq(A.addDays('2024-02-28',1),'2024-02-29','2024 是闰年');
    eq(A.addDays('2024-02-29',1),'2024-03-01');
    eq(A.addDays('2023-02-28',1),'2023-03-01','2023 不是闰年');
    eq(A.addDays('2020-02-28',2),'2020-03-01');
  }],
  ['周一为一周起点的周起始日',async()=>{
    W.__app.state.settings.weekStart=1; W.__app.save();
    eq(W.__app.weekStartOf('2026-09-13'),'2026-09-07','周日应回到上周一');
    eq(W.__app.weekStartOf('2026-09-07'),'2026-09-07','周一即本周起点');
    eq(W.__app.weekStartOf('2026-09-12'),'2026-09-07','周六回到周一');
  }],
  ['周日为一周起点的周起始日',async()=>{
    W.__app.state.settings.weekStart=0; W.__app.save();
    eq(W.__app.weekStartOf('2026-09-13'),'2026-09-13','周日即起点');
    eq(W.__app.weekStartOf('2026-09-12'),'2026-09-06','周六回到周日');
    W.__app.state.settings.weekStart=1; W.__app.save();
  }],
  ['界面上连续翻页日期始终有效',async()=>{
    await reset(); await go('plan');
    for(let i=0;i<400;i++) clickAct('plan-prev');
    await sleep(30);
    assert(!/Invalid|undefined|NaN/.test(viewText()),'往前翻 400 天出现异常');
    for(let i=0;i<800;i++) clickAct('plan-next');
    await sleep(30);
    assert(!/Invalid|undefined|NaN/.test(viewText()),'往后翻 800 天出现异常');
    clickAct('plan-today');
  }]
]);

group('阶段二 2.5 备份导入校验',[
  ['备份导入大小上限为 50MB（v5.1 起含图片备份）',async()=>{
    eq(W.__app.state.v,2);
    const input=D.querySelector('input[type=file]');
    assert(input&&/json/.test(input.accept),'备份文件选择器应存在且接受 json');
    // 超 50MB：真实派发 change，应被立即拒绝且不读文件
    const big=new W.File(['x'.repeat(50*1024*1024+10)],'big.json',{type:'application/json'});
    const dt=new W.DataTransfer(); dt.items.add(big);
    input.files=dt.files;
    input.dispatchEvent(new W.Event('change',{bubbles:true}));
    await sleep(120);
    assert(/超过 50MB/.test(toastText()),'应提示超过 50MB，实际：'+toastText());
  }],
  ['导入损坏文件：提示失败且原数据不变',async()=>{
    await reset();
    W.__app.state.quickNotes.push({id:'keep',text:'保留数据',t:1,d:W.__app.today()}); W.__app.save();
    const input=D.querySelector('input[type=file]');
    const dt=new W.DataTransfer();
    dt.items.add(new W.File(['这不是JSON'],'bad.json',{type:'application/json'}));
    input.files=dt.files;
    input.dispatchEvent(new W.Event('change',{bubbles:true}));
    await waitFor(()=>/导入失败/.test(toastText()),4000);
    assert(/导入失败/.test(toastText()),'应提示导入失败，实际：'+toastText());
    eq(W.__app.state.quickNotes.length,1,'原数据不应变化');
  }],
  ['导入结构错误的 JSON：拒绝',async()=>{
    const input=D.querySelector('input[type=file]');
    const dt=new W.DataTransfer();
    dt.items.add(new W.File([JSON.stringify({v:1,hello:1})],'wrong.json',{type:'application/json'}));
    input.files=dt.files;
    input.dispatchEvent(new W.Event('change',{bubbles:true}));
    await waitFor(()=>/导入失败/.test(toastText()),4000);
    assert(/导入失败/.test(toastText()),'应拒绝非本应用备份');
    eq(W.__app.state.quickNotes.length,1,'原数据不应变化');
  }],
  ['导入合法备份：数据被替换',async()=>{
    const fresh=W.__app.defaultState();
    fresh.settings.name='导入的人';
    fresh.quickNotes.push({id:'n1',text:'来自备份',t:2,d:W.__app.today()});
    const input=D.querySelector('input[type=file]');
    const dt=new W.DataTransfer();
    dt.items.add(new W.File([JSON.stringify(fresh)],'ok.json',{type:'application/json'}));
    input.files=dt.files;
    input.dispatchEvent(new W.Event('change',{bubbles:true}));
    await waitFor(()=>/已导入/.test(toastText()),4000);
    assert(/已导入/.test(toastText()),'应提示成功，实际：'+toastText());
    eq(W.__app.state.settings.name,'导入的人');
    eq(W.__app.state.quickNotes.length,1);
    eq(W.__app.state.quickNotes[0].text,'来自备份');
  }]
]);

/* ================================================================
   阶段三：功能增强
================================================================ */
group('阶段三 3.1 重复任务模板',[
  ['新建模板并保存到模板库',async()=>{
    await reset(); await go('plan');
    clickAct('tpl-open'); await waitFor(()=>D.querySelector('#tplMask'));
    assert(/还没有模板/.test(tplText()),'面板应显示空状态');
    D.querySelector('#tplText').value='晨跑 3 公里';
    D.querySelector('#tplTime').value='07:00';
    D.querySelector('#tplPri').value='高';
    clickAct('tpl-add'); await sleep(70);
    eq(W.__app.state.taskTemplates.length,1);
    const t=W.__app.state.taskTemplates[0];
    eq(t.text,'晨跑 3 公里'); eq(t.time,'07:00'); eq(t.pri,'高');
    assert(tplText().includes('晨跑 3 公里'),'面板应显示模板');
  }],
  ['模板内容为空时阻止新建',async()=>{
    D.querySelector('#tplText').value='   ';
    clickAct('tpl-add'); await sleep(50);
    eq(W.__app.state.taskTemplates.length,1,'不应新增');
    assert(/先输入/.test(toastText()));
    D.querySelector('#tplText').value='喝水';
  }],
  ['一键应用模板到今天，生成独立任务且模板保留',async()=>{
    clickAct('tpl-apply'); await sleep(70);
    const list=W.__app.tasksOf(W.__app.today());
    eq(list.length,1,'今日应有 1 条任务');
    eq(list[0].text,'晨跑 3 公里'); eq(list[0].time,'07:00'); eq(list[0].pri,'高');
    eq(list[0].done,false);
    eq(W.__app.state.taskTemplates.length,1,'模板本身不应消失');
    assert(list[0].id!==W.__app.state.taskTemplates[0].id,'任务与模板 id 应不同');
  }],
  ['可把模板应用到其它日期（明天）',async()=>{
    W.__app.ui.planDate=W.__app.addDays(W.__app.today(),1);
    await go('plan'); await waitFor(()=>D.querySelector('#tplMask'));
    clickAct('tpl-apply'); await sleep(70);
    eq(W.__app.tasksOf(W.__app.addDays(W.__app.today(),1)).length,1,'明天应有任务');
  }],
  ['删除模板',async()=>{
    W.__app.ui.planDate=W.__app.today(); await go('plan');
    await waitFor(()=>D.querySelector('#tplMask'));
    clickAct('tpl-del'); await sleep(60);
    eq(W.__app.state.taskTemplates.length,0);
    clickAct('tpl-close'); await sleep(50);
    assert(!D.querySelector('#tplMask'),'面板应关闭');
  }]
]);

group('阶段三 3.2 饮食按餐次分组',[
  ['添加餐饮弹窗含餐次选择，默认值为四餐之一',async()=>{
    await reset();
    W.__app.ui.dietTab='today'; await go('diet');
    clickAct('meal-add'); await waitModal();

function pngBytes(){ // 标准 1x1 PNG
  const b64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  const bin=W.atob(b64); const a=new W.Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return a;
}
const PNG_B64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';

  ['健身 CSV：多动作展开为多行；无动作训练保留一行；体重独立导出',async()=>{
    await reset(); const A=W.__app;
    A.state.fitness.logs=[
      {id:'l2',date:'2026-03-02',name:'胸',ex:[{name:'卧推',sets:4,reps:8,weight:60},{name:'俯卧撑',sets:3,reps:20,weight:''}]},
      {id:'l1',date:'2026-03-01',name:'恢复走',ex:[]}
    ];
    A.state.fitness.weight=[{id:'w2',date:'2026-03-02',kg:70.5},{id:'w1',date:'2026-03-01',kg:71}]; A.save();
    const log=A.csvBuild('fitlog');
    eq(log.rows.length,3);
    eq(log.rows[0],['2026-03-01','恢复走','','','','']);
    eq(log.rows[1],['2026-03-02','胸','卧推',4,8,60]);
    eq(log.rows[2],['2026-03-02','胸','俯卧撑',3,20,'']);
    eq(A.csvBuild('weight').rows,[['2026-03-01',71],['2026-03-02',70.5]]);
  }],
  ['冥想 CSV：时长与备注（逗号转义）',async()=>{
    await reset(); const A=W.__app;
    A.state.meditation=[
      {id:'d2',date:'2026-03-02',minutes:10,note:'早起,静心'},
      {id:'d1',date:'2026-03-01',minutes:20,note:''}
    ]; A.save();
    const r=A.csvBuild('meditation');
    eq(r.rows[0],['2026-03-01',20,'']);
    eq(r.rows[1],['2026-03-02',10,'早起,静心']);
    assert(/"早起,静心"/.test(A.toCSV(r.headers,r.rows)));
  }],
  ['日记 CSV：心情/正文换行转义/配图数',async()=>{
    await reset(); const A=W.__app;
    A.state.diary['2026-03-02']={text:'今天很充实\n继续加油',mood:'开心',photos:['p1','p2']};
    A.state.diary['2026-03-01']={text:'平淡',mood:'',photos:[]}; A.save();
    const r=A.csvBuild('diary');
    eq(r.rows[0],['2026-03-01','','平淡',0]);
    eq(r.rows[1],['2026-03-02','开心','今天很充实\n继续加油',2]);
    const csv=A.toCSV(r.headers,r.rows);
    assert(/"今天很充实\n继续加油"/.test(csv),'含换行正文应被引号包裹');
  }],
  ['习惯 CSV：累计天数与当前连续天数',async()=>{
    await reset(); const A=W.__app,t=A.today();
    A.state.habits=[
      {id:'h1',name:'阅读',checks:[t,A.addDays(t,-1),A.addDays(t,-5)]},
      {id:'h2',name:'跑步',checks:[]}
    ]; A.save();
    const r=A.csvBuild('habits');
    eq(r.rows[0],['阅读',3,2],'最近两天连续，streak 应为 2');
    eq(r.rows[1],['跑步',0,0]);
  }],
  ['空数据：全部模块仅含表头且不报错；未知模块抛错',async()=>{
    await reset(); const A=W.__app;
    const kinds=['tasks','diet','water','games','fitlog','weight','meditation','diary','habits'];
    kinds.forEach(k=>{
      const r=A.csvBuild(k);
      assert(Array.isArray(r.headers)&&r.headers.length>0,k+' 应有表头');
      eq(r.rows.length,0,k+' 空数据行数应为 0');
    });
    let threw=false; try{ A.csvBuild('nope'); }catch(e){ threw=true; }
    assert(threw,'未知模块应抛错');
  }],
  ['设置页点击按钮：真实生成 text/csv 文件（含 BOM 与数据）',async()=>{
    await reset(); const A=W.__app;
    A.state.tasks[A.today()]=[{id:'t1',text:'CSV 联调任务',time:'10:00',pri:'中',note:'',done:false}]; A.save();
    await go('settings');
    clickAct('csv-tasks');
    let txt='';
    await waitFor(async()=>{ try{ txt=await bootApp.lastBlobOfType('text/csv'); return /CSV 联调任务/.test(txt); }catch(e){ return false; } },4000);
    assert(/日期,内容,计划时间/.test(txt),'应包含中文表头');
    assert(/CSV 联调任务/.test(txt));
    assert(/CSV 已导出/.test(toastText()),'应有导出提示，实际：'+toastText());
  }]
]);

group('阶段五 5.5 PWA（manifest + Service Worker）',[
  ['页面头部包含 manifest、theme-color 与图标声明',async()=>{
    const link=D.querySelector('link[rel="manifest"]');
    assert(link&&/manifest\.webmanifest$/.test(link.getAttribute('href')),'应有 manifest 链接');
    eq(D.querySelector('meta[name="theme-color"]').content,'#4f6ef7');
    const icon=D.querySelector('link[rel="icon"]');
    assert(icon&&/icon\.svg$/.test(icon.getAttribute('href')),'应有 SVG 图标');
    eq(icon.type,'image/svg+xml');
  }],
  ['注册代码仅在 http(s) 下执行：file:// 双击用法不受影响',async()=>{
    const src=await (await W.fetch('/index.html')).text();
    assert(/'serviceWorker' in navigator/.test(src),'应做能力检测');
    assert(/https\?:/.test(src),'应校验协议，file: 下不注册');
    assert(/register\('sw\.js'\)/.test(src),'应注册 sw.js');
  }],
  ['manifest 可访问且字段完整，图标文件真实存在',async()=>{
    const res=await W.fetch('manifest.webmanifest');
    assert(res.ok,'manifest 应返回 200');
    const m=await res.json();
    assert(m.name&&m.short_name,'应有名称');
    eq(m.display,'standalone');
    assert(/^[\w.\/-]*index\.html/.test(m.start_url),'start_url 应指向 index.html');
    assert(Array.isArray(m.icons)&&m.icons.length>=1,'至少一个图标');
    const iconRes=await W.fetch(m.icons[0].src);
    assert(iconRes.ok,'图标应可访问');
    const body=await iconRes.text();
    assert(/<svg[\s>]/i.test(body.slice(0,200)),'图标应为 SVG，实际开头：'+body.slice(0,40));
  }],
  ['sw.js 可访问，含安装/激活/拦截三段逻辑',async()=>{
    const res=await W.fetch('sw.js');
    assert(res.ok,'sw.js 应返回 200');
    assert(/application\/javascript|text\/javascript/.test(res.headers.get('content-type')||''),'MIME 应为 JS，实际：'+res.headers.get('content-type'));
    const js=await res.text();
    ['install','activate','fetch','caches','skipWaiting','clients.claim'].forEach(k=>{
      assert(js.indexOf(k)>=0,'sw.js 应包含 '+k);
    });
    assert(/index\.html/.test(js),'应预缓存应用外壳');
  }],
  ['http 环境下自动注册并激活 Service Worker',async()=>{
    const reg=await waitFor(async()=>{
      const r=await W.navigator.serviceWorker.getRegistration();
      return r&&r.active?r:null;
    },9000);
    assert(/sw\.js/.test(reg.active.scriptURL),'active worker 应来自 sw.js');
  }],
  ['重新加载后受 SW 控制，且应用外壳已入缓存（可离线）',async()=>{
    await bootApp();
    await waitFor(()=>W.navigator.serviceWorker.controller,9000);
    const cache=await waitFor(async()=>{
      const keys=await W.caches.keys();
      const k=keys.find(x=>/^lifeapp/.test(x));
      if(!k) return null;
      const hit=await W.caches.match(W.location.origin+'/index.html');
      return hit?k:null;
    },9000);
    assert(cache,'应存在 lifeapp 缓存且含 index.html 外壳');
  }]
]);

run();
</script>
