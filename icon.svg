<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="我的生活助手">
  <title>我的生活助手</title>
  <defs>
    <radialGradient id="glow" cx="30%" cy="18%" r="88%">
      <stop offset="0" stop-color="#7c95ff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#7c95ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7c95ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c8ff"/>
      <stop offset="1" stop-color="#7c95ff"/>
    </linearGradient>
  </defs>

  <!-- 底：深空 -->
  <rect width="512" height="512" rx="116" fill="#08090c"/>
  <!-- 大气层辉光 -->
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- 生活助手：屋形轮廓，圆头线稿，与站内线性图标同族 -->
  <g fill="none" stroke="url(#mark)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 244 L256 130 L394 244"/>
    <path d="M164 226 L164 372 Q164 388 180 388 L332 388 Q348 388 348 372 L348 226"/>
    <path d="M216 388 L216 300 Q216 288 228 288 L284 288 Q296 288 296 300 L296 388"/>
  </g>

  <!-- 呼吸点：强调色，呼应界面里的活动指示 -->
  <circle cx="256" cy="196" r="17" fill="#7c95ff"/>
</svg>
